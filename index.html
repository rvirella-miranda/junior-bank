  :root{
    --ink:#3A3547;
    --paper:#F8F4EC;
    --paper-2:#EFE9DD;
    --teal:#58763F;
    --teal-light:#7C9A66;
    --gold:#E9C76B;
    --gold-light:#F5E8C8;
    --rust:#B5544A;
    --line:#D9D2C3;
    --white:#FFFEFB;
    --savings-blue:#5F83AD;
    --plum:#4A4458;
    --plum-dark:#2F2A3B;
    --lav:#7D6A9E;
    --pink:#F4DCE4;
    --mint:#D9EADF;
    --butter:#F5E8C8;
    --lavender:#E5DAF0;
    --sky:#DCE6F3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    color:var(--ink);
    font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
    min-height:100vh;
    background-color:var(--paper);
    background-image:
      linear-gradient(rgba(110,120,150,.14) 1px, transparent 1px),
      linear-gradient(90deg, rgba(110,120,150,.14) 1px, transparent 1px);
    background-size:30px 30px;
  }
  h1,h2,h3,.display{ font-family:'Lora',Georgia,serif; font-weight:600; letter-spacing:0;}
  .mono{ font-family:'IBM Plex Mono',monospace; }
  button{ font-family:'Poppins',sans-serif; cursor:pointer; }
  input,select{ font-family:'Poppins',sans-serif; }

  /* ---------- layout shells ---------- */
  #app{ min-height:100vh; display:flex; flex-direction:column;}
  .topbar{
    background:linear-gradient(135deg, var(--teal), var(--teal-light)); color:var(--paper); padding:14px 22px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:3px solid var(--gold); box-shadow:0 2px 12px rgba(74,64,56,.10);
  }
  .topbar .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:36px;height:36px;border-radius:12px;background:var(--gold);
    display:flex;align-items:center;justify-content:center;color:var(--teal);
    font-family:'Lora'; font-weight:700; font-size:16px;
    box-shadow:0 2px 6px rgba(0,0,0,.12);
  }
  .brand-title{ font-size:18px; }
  .brand-sub{ font-size:11px; opacity:.75; letter-spacing:.06em; text-transform:uppercase; }
  .topbar-right{ display:flex; align-items:center; gap:14px; font-size:13px;}
  .logout-btn{
    background:transparent;border:1px solid rgba(250,243,225,.4); color:var(--paper);
    padding:6px 12px; border-radius:20px; font-size:12px;
  }
  .logout-btn:hover{ background:rgba(250,243,225,.12); }

  .tabs{
    display:flex; gap:2px; background:rgba(244,234,216,0.85); padding:0 16px;
    border-bottom:1px solid var(--line); overflow-x:auto;
  }
  .tab{
    padding:12px 16px; font-size:13.5px; font-weight:500; color:#6b6250;
    border-bottom:3px solid transparent; white-space:nowrap; background:none; border-top:none; border-left:none; border-right:none;
  }
  .tab.active{ color:var(--teal); border-bottom-color:var(--gold); font-weight:700; border-radius:8px 8px 0 0; background:rgba(255,255,255,.5); }

  .content{ flex:1; padding:22px; max-width:1100px; width:100%; margin:0 auto; }

  .card{
    background:var(--white); border:1px solid var(--line); border-radius:18px;
    padding:20px; margin-bottom:18px; box-shadow:0 4px 18px rgba(74,64,56,.06);
  }
  .card h3{ margin:0 0 12px 0; font-size:15px; color:var(--teal); }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  @media (max-width:720px){ .grid2,.grid3{ grid-template-columns:1fr; } }

  label{ display:block; font-size:12px; font-weight:600; color:#6b6250; margin-bottom:4px; text-transform:uppercase; letter-spacing:.03em;}
  input[type=text],input[type=number],input[type=password],select{
    width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:12px;
    font-size:14px; background:var(--white); color:var(--ink); margin-bottom:12px;
  }
  input:focus,select:focus{ outline:2px solid var(--teal-light); outline-offset:1px; }

  .btn{
    display:inline-flex; align-items:center; gap:6px; padding:10px 18px; border-radius:22px;
    border:none; font-size:13.5px; font-weight:700; background:var(--teal); color:var(--paper);
  }
  .btn:hover{ background:var(--teal-light); }
  .btn.gold{ background:var(--gold); color:var(--ink); }
  .btn.gold:hover{ background:var(--gold-light); }
  .btn.rust{ background:var(--rust); color:var(--paper); }
  .btn.rust:hover{ background:#c2493d; }
  .btn.ghost{ background:transparent; color:var(--teal); border:1px solid var(--line); }
  .btn.ghost:hover{ background:var(--paper-2); }
  .btn.sm{ padding:5px 10px; font-size:12px; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  table{ width:100%; border-collapse:collapse; font-size:13.5px;}
  th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:#A99A85; padding:6px 8px; border-bottom:2px solid var(--line); }
  td{ padding:8px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tr:last-child td{ border-bottom:none; }

  .pill{ display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:600; }
  .pill.paid{ background:#e3efe6; color:var(--teal); }
  .pill.unpaid{ background:#f5e3dd; color:var(--rust); }
  .pill.income{ background:#e3efe6; color:var(--teal); }
  .pill.expense{ background:#f5e3dd; color:var(--rust); }

  .empty{ text-align:center; color:#9a9078; padding:30px 10px; font-size:13.5px; }

  /* ---------- login screen ---------- */
  .login-wrap{
    flex:1; display:flex; align-items:center; justify-content:center; padding:20px;
    background:
      radial-gradient(circle at 20% 20%, rgba(200,155,60,.10), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(14,75,67,.10), transparent 40%),
      var(--paper);
  }
  .login-card{
    background:var(--white); border:1px solid var(--line); border-radius:24px;
    padding:36px; width:100%; max-width:420px; box-shadow:0 16px 50px rgba(74,64,56,.14);
  }
  .login-mark{
    width:60px;height:60px;border-radius:18px;background:var(--teal);
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px auto;
    color:var(--gold); font-family:'Lora'; font-weight:700; font-size:26px;
    box-shadow:0 4px 12px rgba(124,154,115,.35);
  }
  .login-title{ text-align:center; font-size:22px; margin-bottom:2px;}
  .login-sub{ text-align:center; font-size:13px; color:#A99A85; margin-bottom:24px; }
  .role-toggle{ display:flex; gap:8px; margin-bottom:20px; }
  .role-toggle button{
    flex:1; padding:10px; border-radius:14px; border:1px solid var(--line); background:var(--paper);
    font-size:13.5px; font-weight:700; color:#6b6250;
  }
  .role-toggle button.active{ background:var(--teal); color:var(--paper); border-color:var(--teal); }
  .error-msg{ color:var(--rust); font-size:12.5px; margin:-6px 0 12px 0; }

  /* ---------- passbook / student home ---------- */
  .passbook{
    background-color:var(--teal);
    background-image: repeating-linear-gradient(135deg, rgba(255,255,255,0.06) 0px, rgba(255,255,255,0.06) 2px, transparent 2px, transparent 14px), linear-gradient(135deg, var(--teal), var(--teal-light));
    color:var(--paper); border-radius:22px; padding:24px;
    position:relative; overflow:hidden; margin-bottom:18px; box-shadow:0 10px 30px rgba(124,154,115,.25);
  }
  .passbook .eyebrow{ font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:rgba(255,255,255,.92); text-shadow:0 1px 2px rgba(0,0,0,.15); }
  .passbook .name{ font-size:22px; margin:2px 0 14px 0; color:#FFFFFF; font-weight:700; text-shadow:0 1px 3px rgba(0,0,0,.18); }
  .passbook .balances{ display:flex; gap:28px; flex-wrap:wrap; }
  .balances .bal-label{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:rgba(255,255,255,.9); text-shadow:0 1px 2px rgba(0,0,0,.15); }
  .balances .bal-amt{ font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace; font-size:26px; font-weight:700; color:#FFFFFF; text-shadow:0 1px 3px rgba(0,0,0,.18); }
  .passbook .job-line{ margin-top:14px; font-size:12.5px; color:rgba(255,255,255,.92); text-shadow:0 1px 2px rgba(0,0,0,.15); border-top:1px solid rgba(255,255,255,.25); padding-top:10px;}

  .stamp{
    display:inline-block; border:2px solid var(--teal); color:var(--teal); font-family:'Lora';
    font-weight:700; font-size:11px; padding:2px 10px; border-radius:20px; transform:rotate(-6deg);
    text-transform:uppercase; letter-spacing:.05em;
  }
  .stamp.due{ border-color:var(--rust); color:var(--rust); }

  .ledger-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px dashed var(--line); font-size:13.5px;}
  .ledger-row:last-child{ border-bottom:none; }
  .ledger-amt{ font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace; font-weight:600; }
  .ledger-amt.pos{ color:var(--teal); }
  .ledger-amt.neg{ color:var(--rust); }

  .store-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:14px; }
  .store-item{ border:1px solid var(--line); border-radius:16px; padding:14px; background:var(--white); box-shadow:0 3px 12px rgba(74,64,56,.06); }
  .store-item .ithumb{ width:100%; height:96px; object-fit:cover; border-radius:7px; margin-bottom:10px; border:1px solid var(--line); background:var(--paper-2); }
  .store-item .ithumb-placeholder{ width:100%; height:96px; border-radius:7px; margin-bottom:10px; border:1px dashed var(--line); background:var(--paper-2); display:flex; align-items:center; justify-content:center; color:#b0a687; font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  .store-item .iname{ font-weight:600; margin-bottom:4px; }
  .store-item .iprice{ font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace; color:var(--teal); font-weight:600; font-size:16px; margin-bottom:8px;}
  .store-item .istock{ font-size:11.5px; color:#A99A85; margin-bottom:10px; }
  .cat-tabs{ display:flex; flex-wrap:wrap; gap:8px; margin:2px 0 18px 0; }
  .cat-tab{ border:1.5px solid var(--line); background:var(--paper); color:#6b6250; font-weight:700; font-size:13px; padding:7px 14px; border-radius:20px; }
  .cat-tab:hover{ background:var(--paper-2); }
  .cat-tab.active{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .cat-tab .cat-count{ opacity:.75; font-weight:600; margin-left:3px; }
  .store-section-title{ font-family:'Lora'; font-weight:700; font-size:16px; color:var(--teal); margin:20px 0 10px 0; padding-bottom:6px; border-bottom:2px solid var(--line); }
  .store-section-title:first-child{ margin-top:4px; }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:11px 20px; border-radius:8px;

<script>
/* =========================================================

const STORAGE_KEY = 'junior-bank-db-v1'; // only used for previews inside Claude

/* ============================================================
   PASTE YOUR FIREBASE REALTIME DATABASE URL BELOW

   It looks like: https://your-project-default-rtdb.firebaseio.com

const FIREBASE_DB_URL = 'https://junior-bank-547c3-default-rtdb.firebaseio.com';
const FIREBASE_ROOT = 'juniorBank'; // the folder inside your database this app uses
const COLLECTIONS = ['students','households','bills','charges','storeCategories','storeItems','transactions'];

const defaultDb = () => ({
  teacherPin: '1234',
  students: [],      // {id,name,pin,jobTitle,payAmount,payFreq,householdId,checking,savings}
  households: [],     // {id,name}
  bills: [],           // {id,name,amount,freq,targetType,targetId} freq: 'one-time'|'weekly'|'biweekly'|'monthly'

  storeItems: [],      // {id,name,price,stock,categoryId,image} stock:null = unlimited
  transactions: []     // {id,ts,studentId,type,amount,desc}
});

let db = null;
let session = { role: null, studentId: null }; // role: 'teacher' | 'student'
let uiState = { teacherTab:'students', studentTab:'home', loginRole:'student', loginError:'', editingChargeId:null, editingPayrollId:null, billTargetMode:'student', editingLedgerTxId:null, ledgerFilter:'', editingBillId:null, editingStoreItemId:null, editingCategoryId:null, storeCategory:'all', storeSearch:'', expandedIssues:{}, ledgerType:'all', ledgerSearch:'', ledgerFrom:'', ledgerTo:'', ledgerGroup:true, expandedTx:{}, actType:'all', actSearch:'', actFrom:'', actTo:'', actGroup:true, expandedStx:{} };

  const base = defaultDb();
  Object.keys(base).forEach(k=>{ if (d[k] === undefined || d[k] === null) d[k] = base[k]; });

}
function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }
function money(cents){
  const neg = cents < 0;
  const v = (Math.abs(cents)/100).toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
  return (neg?'-':'') + '$' + v;
}
function toCents(dollarsStr){
  const n = parseFloat(dollarsStr);
  if (isNaN(n)) return 0;
  return Math.round(n*100);
}

function resizeImageFile(file, maxDim){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error('read failed'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('image decode failed'));
      img.onload = ()=>{
        let { width, height } = img;
        if (width > height){ if (width > maxDim){ height = Math.round(height*maxDim/width); width = maxDim; } }
        else { if (height > maxDim){ width = Math.round(width*maxDim/height); height = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ------------------------------------------------------------------
   FIREBASE STORAGE LAYER
   Each student, charge, transaction, etc. is its own small record in the
   database. When something changes we send ONLY the records that changed
   (and balance changes are sent as "add/subtract this amount", not "set
   the balance to X"), so two people acting at the same time can never
   erase each other's work.
   ------------------------------------------------------------------ */
let netBusy = 0; // number of database requests currently in flight
async function fbFetch(url, opts){
  netBusy++;
  const ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const timer = ctl ? setTimeout(()=>ctl.abort(), 20000) : null;
  try{
    const res = await fetch(url, ctl ? { ...(opts || {}), signal: ctl.signal } : opts);
    const text = await res.text();
    return { ok: res.ok, status: res.status, text };
  }catch(e){
    if (e && e.name === 'AbortError') throw new Error('The database took too long to answer (over 20 seconds)');
    throw e;
  }finally{
    if (timer) clearTimeout(timer);
    netBusy--;
  }
}
// While something is being saved, ignore extra clicks. Otherwise a double-click on
// "Pay" or "Buy" would run the action twice and apply the money twice.
if (typeof document !== 'undefined' && document.addEventListener){
  document.addEventListener('click', e=>{
    if (netBusy > 0 && e.target && e.target.closest && e.target.closest('button, label, select')){
      e.preventDefault(); e.stopPropagation();
      showToast('One moment — saving…');
    }
  }, true);
}
function fbUrl(extra){
  return FIREBASE_DB_URL.replace(/\/+$/,'') + '/' + FIREBASE_ROOT + '.json' + (extra || '');
}
async function fbRead(){
  const res = await fbFetch(fbUrl());
  const text = res.text;
  if (!res.ok) throw new Error('Firebase answered HTTP ' + res.status + ' — ' + text.slice(0,120));
  try { return JSON.parse(text); }
  catch(e){ throw new Error('Firebase returned something unexpected (starts with: ' + text.slice(0,80).replace(/\s+/g,' ') + ')'); }
}
async function fbPatch(ops){
  const res = await fbFetch(fbUrl('?print=silent'), { method:'PATCH', body: JSON.stringify(ops) });
  if (!res.ok) throw new Error('Firebase answered HTTP ' + res.status + ' — ' + res.text.slice(0,120));
}
function toRecords(x){
  if (!x) return [];
  if (Array.isArray(x)) return x.filter(v=>v && typeof v === 'object');
  return Object.entries(x).filter(([k,v])=>v && typeof v === 'object').map(([k,v])=>({ ...v, id: v.id || k }));
}
function toPlainList(x){
  if (!x) return [];
  return Array.isArray(x) ? x.filter(v=>v!==null && v!==undefined) : Object.values(x);
}
// Firebase drops empty values (null, empty lists), so every record is rebuilt
// with sensible defaults when it's read back.
const normalizers = {
  students:     r => ({ id:r.id, name:r.name, pin:String(r.pin ?? ''), jobTitle:r.jobTitle ?? '', payAmount:r.payAmount ?? 0, payFreq:r.payFreq ?? 'weekly', householdId:r.householdId ?? null, checking:r.checking ?? 0, savings:r.savings ?? 0 }),
  households:   r => ({ id:r.id, name:r.name ?? '' }),
  bills:        r => { const o = { id:r.id, name:r.name ?? '', amount:r.amount ?? 0, targetType:r.targetType }; if (r.targetId !== undefined) o.targetId = r.targetId; if (r.targetIds !== undefined) o.targetIds = toPlainList(r.targetIds); return o; },
  charges:      r => ({ id:r.id, billId:r.billId ?? null, issueId:r.issueId ?? null, billName:r.billName ?? '', studentId:r.studentId, amount:r.amount ?? 0, paid:!!r.paid, createdAt:r.createdAt ?? 0, paidAt:r.paidAt ?? null }),
  storeCategories: r => ({ id:r.id, name:r.name ?? '' }),
  storeItems:   r => ({ id:r.id, name:r.name ?? '', price:r.price ?? 0, stock:(r.stock === undefined ? null : r.stock), categoryId:r.categoryId ?? null, image:r.image ?? null }),
  transactions: r => ({ id:r.id, ts:r.ts ?? 0, studentId:r.studentId, type:r.type, amount:r.amount ?? 0, desc:r.desc ?? '', account:r.account || 'checking' })
};
function snapshotToDb(raw){
  raw = raw || {};
  const out = defaultDb();
  out.teacherPin = (raw.meta && raw.meta.teacherPin) ? String(raw.meta.teacherPin) : '1234';
  COLLECTIONS.forEach(c=>{
    out[c] = toRecords(raw[c]).filter(r => r.id && (c !== 'students' || r.name)).map(normalizers[c]);
  });
  const byName = (a,b)=>String(a.name).localeCompare(String(b.name));
  out.students.sort(byName); out.households.sort(byName); out.bills.sort(byName); out.storeItems.sort(byName); out.storeCategories.sort(byName);
  out.charges.sort((a,b)=>a.createdAt-b.createdAt);
  out.transactions.sort((a,b)=>a.ts-b.ts);
  return out;
}
function buildPatch(current, baseline){
  const ops = {};
  if (current.teacherPin !== baseline.teacherPin) ops['meta/teacherPin'] = current.teacherPin;
  COLLECTIONS.forEach(c=>{
    const curMap = {}, baseMap = {};
    current[c].forEach(r=>{ curMap[r.id] = r; });
    baseline[c].forEach(r=>{ baseMap[r.id] = r; });
    Object.keys(curMap).forEach(id=>{
      const cr = curMap[id], br = baseMap[id];
      if (!br){ ops[c + '/' + id] = JSON.parse(JSON.stringify(cr)); return; }
      const keys = new Set([...Object.keys(cr), ...Object.keys(br)]);
      keys.forEach(k=>{
        if (k === 'id') return;
        const cv = cr[k], bv = br[k];
        if (JSON.stringify(cv) === JSON.stringify(bv)) return;
        const isCounter = (c === 'students' && (k === 'checking' || k === 'savings')) || (c === 'storeItems' && k === 'stock');
        if (isCounter && typeof cv === 'number' && typeof bv === 'number'){
          ops[c + '/' + id + '/' + k] = { '.sv': { increment: cv - bv } };
        } else {
          ops[c + '/' + id + '/' + k] = (cv === undefined) ? null : cv;
        }
      });
    });
    Object.keys(baseMap).forEach(id=>{ if (!curMap[id]) ops[c + '/' + id] = null; });
  });
  return ops;
}
async function pullFromServer(){
  const fresh = snapshotToDb(await fbRead());
  db = fresh;
  lastSynced = JSON.parse(JSON.stringify(fresh));
}

/**
 * Pulls the absolute latest saved data and replaces the local `db` with it.
 * Every action that changes something calls this FIRST, so it always works
 * from a snapshot that's at most a fraction of a second old.
 */
async function refreshDb(){
  if (backendMode !== 'firebase') return; // nothing shared to refresh from
  try{
    await pullFromServer();
  }catch(e){
    console.error('refresh before save failed', e);
    // Keep working with whatever we have; because changes are sent as
    // "what changed since the last sync", this is still safe.
  }
}

async function loadDb(){
  // 1) Preferred: a configured Firebase database — works for anyone with
  //    the link, no Claude or Google login required.
  if (FIREBASE_DB_URL){
    try{
      await pullFromServer();
      backendMode = 'firebase';
      return;
    }catch(e){
      // Connection/permission problem: do NOT save anything. Show a blank
      // local session so nothing looks silently fine, but the real data on
      // the server is left completely untouched.
      console.error('backend load failed', e);
      db = defaultDb();
      lastSynced = JSON.parse(JSON.stringify(db));
      backendMode = 'firebase';
      backendLoadFailed = true;
      backendLoadError = (e && e.message) ? e.message : String(e);
      showToast('Could not reach the database — your saved data is safe, but not loaded this time. Check your connection and reload.');
      return;
    }
  }
  // 2) Fallback for previewing inside Claude only (not shared with students)
  if (typeof window.storage !== 'undefined'){
    try{
      const res = await window.storage.get(STORAGE_KEY, true);
      db = ensureShape(JSON.parse(res.value));
    }catch(e){
      db = defaultDb();
    }
    backendMode = 'claude-storage';
    return;
  }
  // 3) No database configured at all — in-memory only for this tab
  db = defaultDb();
  backendMode = 'none';
}
async function saveDb(){
  if (backendLoadFailed){
    showToast("Not connected to your saved data right now — reload the page before making changes.");
    return false;
  }
  try{
    if (backendMode === 'firebase'){
      const ops = buildPatch(db, lastSynced);
      if (Object.keys(ops).length === 0) return true;
      await fbPatch(ops);
      // Re-read so we're holding exactly what the server now has.
      try { await pullFromServer(); }
      catch(e){ lastSynced = JSON.parse(JSON.stringify(db)); }
      return true;
    } else if (backendMode === 'claude-storage' && typeof window.storage !== 'undefined'){
      await window.storage.set(STORAGE_KEY, JSON.stringify(db), true);
      return true;
    }
    // backendMode === 'none' -> nothing persists between reloads; that's expected until setup is complete
    return true;
  }catch(e){
    console.error('save failed', e);
    showToast("Couldn't save — your last change may be lost if you leave this page. Check your connection and try again.");
    return false;
  }
}
/**
 * Saves, and only shows the success message if the save actually succeeded.
 * Use this instead of "await saveDb(); showToast('...')" everywhere a user
 * action needs feedback — otherwise a failed save gets silently masked by
 * a success toast that fires right after it, regardless of what happened.
 */
async function saveDbWithToast(successMessage){
  const ok = await saveDb();
  if (ok) showToast(successMessage);
  return ok;
}

function groupCharges(){
  // One group per time a bill was issued. Newer charges carry an issueId; older ones are
  // grouped by bill + issued within a minute of each other.
  const sorted = db.charges.slice().sort((a,b)=>(a.createdAt-b.createdAt) || String(a.id).localeCompare(String(b.id)));
  const groups = [], byIssue = {};
  sorted.forEach(c=>{
    let g = c.issueId ? byIssue[c.issueId] : null;
    if (!g && !c.issueId){
      const key = c.billId || c.billName;
      g = groups.find(x=>!x.issueId && x.billKey===key && Math.abs(c.createdAt - x.firstTs) <= 60000);
    }
    if (!g){
      g = { key:c.id, issueId:c.issueId || null, billKey:c.billId || c.billName, firstTs:c.createdAt, billName:c.billName, charges:[] };
      groups.push(g);
      if (c.issueId) byIssue[c.issueId] = g;
    }
    g.charges.push(c);
  });
  return groups.sort((a,b)=>b.firstTs-a.firstTs);
}

function issueChargeForBill(bill){
  const issueId = uid('iss');
  const now = nowTs();
  const mk = (studentId, amount, billName)=>({ id:uid('chg'), billId:bill.id, issueId, billName, studentId, amount, paid:false, createdAt:now, paidAt:null });
  if (bill.targetType === 'student'){
    db.charges.push(mk(bill.targetId, bill.amount, bill.name));
    return 1;
  }
  if (bill.targetType === 'students'){
    const targets = (bill.targetIds||[]).filter(id=>getStudent(id));
    targets.forEach(sid=>{ db.charges.push(mk(sid, bill.amount, bill.name)); });
    return targets.length;
  }
  // Household: split the bill evenly. Remainder cents (if the amount doesn't
  // divide evenly) are handed out one at a time so the total charged always
  // equals the bill amount exactly.
  const targets = getHousehold(bill.targetId)?.id ? db.students.filter(s=>s.householdId===bill.targetId).map(s=>s.id) : [];
  if (targets.length === 0) return 0;
  const base = Math.floor(bill.amount / targets.length);
  let remainder = bill.amount - base * targets.length;
  targets.forEach(sid=>{
    const share = base + (remainder > 0 ? 1 : 0);
    if (remainder > 0) remainder--;
    db.charges.push(mk(sid, share, bill.name + ` (split ${targets.length} ways)`));
  });
  return targets.length;
}

  document.querySelectorAll('[data-save-bill]').forEach(b=>{

      if (!newName || newAmount<=0){ showToast('Enter a name and amount'); return; }
      await refreshDb();
      const bill = db.bills.find(x=>x.id===billId);
      if (!bill){ showToast('This bill no longer exists'); uiState.editingBillId = null; render(); return; }
      bill.name = newName;
      bill.amount = newAmount;
      uiState.editingBillId = null;
      await saveDbWithToast('Bill template updated'); render();
    };
  });
  document.querySelectorAll('[data-toggle-issue]').forEach(b=>{
    b.onclick = ()=>{ const k = b.dataset.toggleIssue; uiState.expandedIssues[k] = !uiState.expandedIssues[k]; render(); };
  });
  document.querySelectorAll('[data-edit-charge]').forEach(b=>{
    b.onclick = ()=>{ uiState.editingChargeId = b.dataset.editCharge; render(); };
  });
  document.querySelectorAll('[data-cancel-charge]').forEach(b=>{
    b.onclick = ()=>{ uiState.editingChargeId = null; render(); };
  });
  document.querySelectorAll('[data-save-charge]').forEach(b=>{
    b.onclick = async ()=>{
      const chargeId = b.dataset.saveCharge;
      const newAmount = toCents(document.getElementById('editChargeAmount').value || '0');
      const newPaid = document.getElementById('editChargePaid').checked;
      await refreshDb();
      const c = db.charges.find(x=>x.id===chargeId);
      if (!c){ showToast('This charge no longer exists'); uiState.editingChargeId = null; render(); return; }
      const student = getStudent(c.studentId);
      const oldAmount = c.amount, oldPaid = c.paid;
      if (student){
        if (oldPaid && newPaid){
          const delta = oldAmount - newAmount; // refund the difference either way
          if (delta !== 0){ student.checking += delta; addTx(student.id,'adjustment', delta, `Bill amount corrected: ${c.billName}`); }
        } else if (oldPaid && !newPaid){
          student.checking += oldAmount;
          addTx(student.id,'adjustment', oldAmount, `Marked unpaid (refund): ${c.billName}`);
        } else if (!oldPaid && newPaid){
          student.checking -= newAmount;
          addTx(student.id,'bill-payment', -newAmount, `Paid (recorded by teacher): ${c.billName}`);
        }
        // if !oldPaid && !newPaid, nothing to adjust — still unpaid
      }
      c.amount = newAmount;
      c.paid = newPaid;
      c.paidAt = newPaid ? (c.paidAt || nowTs()) : null;
      uiState.editingChargeId = null;
      await saveDbWithToast('Charge updated'); render();
    };
  });
  document.querySelectorAll('[data-del-charge]').forEach(b=>{
    b.onclick = async ()=>{
      if (!(await showConfirm('Delete this charge? If it was already paid, the amount will be refunded to the student.'))) return;
      const chargeId = b.dataset.delCharge;
      await refreshDb();
      const idx = db.charges.findIndex(x=>x.id===chargeId);
      if (idx===-1){ showToast('This charge no longer exists'); render(); return; }
      const c = db.charges[idx];
      const student = getStudent(c.studentId);
      if (c.paid && student){
        student.checking += c.amount;
        addTx(student.id,'adjustment', c.amount, `Charge deleted (refund): ${c.billName}`);
      }
      db.charges.splice(idx,1);
      await saveDbWithToast('Charge deleted'); render();
    };
  });
}

/* ---------- transaction filters + combining repeat purchases (used by teacher Ledger and student Activity) ---------- */
const TX_TYPE_FILTERS = [
  ['all','All types'],
  ['payday','Paychecks'],
  ['bill-payment','Bill payments'],
  ['purchase','Purchases'],
  ['transfer-out','Money sent to classmates'],
  ['transfer-in','Money received from classmates'],
  ['internal','Checking ⇄ Savings moves'],
  ['adjustment','Adjustments & corrections']
];
function txTypeOptionsHtml(selected){
  return TX_TYPE_FILTERS.map(([k,l])=>`<option value="${k}" ${k===(selected||'all')?'selected':''}>${l}</option>`).join('');
}
function filterTransactions(txs, f, includeStudentNames){
  const q = (f.search || '').trim().toLowerCase();
  const from = f.from ? new Date(f.from + 'T00:00:00').getTime() : null;
  const to = f.to ? new Date(f.to + 'T23:59:59.999').getTime() : null;
  return txs.filter(t=>{
    if (f.type && f.type !== 'all' && t.type !== f.type) return false;
    if (from !== null && t.ts < from) return false;
    if (to !== null && t.ts > to) return false;
    if (q){
      const hay = (String(t.desc || '') + ' ' + String(t.type || '') + (includeStudentNames ? ' ' + (getStudent(t.studentId)?.name || '') : '')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}
function itemNameOf(t){ return String(t.desc || '').replace(/^Bought:\s*/, ''); }
// Newest first. When groupOn is true, repeat purchases of the same item (same student, same
// price) become ONE entry with a quantity; everything else stays a normal line.
function groupTxsForDisplay(txs, groupOn){
  const sorted = txs.slice().sort((a,b)=>b.ts-a.ts);
  if (!groupOn) return sorted.map(t=>({ kind:'single', tx:t, ts:t.ts }));
  const out = [], groups = {};
  sorted.forEach(t=>{
    if (t.type !== 'purchase'){ out.push({ kind:'single', tx:t, ts:t.ts }); return; }
    const key = t.studentId + '|' + t.desc + '|' + t.amount;
    let g = groups[key];
    if (!g){ g = { kind:'group', studentId:t.studentId, item:itemNameOf(t), unit:t.amount, txs:[], ts:t.ts }; groups[key] = g; out.push(g); }
    g.txs.push(t);
  });
  return out.map(e=>{
    if (e.kind !== 'group') return e;
    if (e.txs.length === 1) return { kind:'single', tx:e.txs[0], ts:e.ts };
    const oldest = e.txs[e.txs.length-1];
    return { ...e, qty:e.txs.length, total:e.txs.reduce((a,t)=>a+t.amount,0), firstTs:oldest.ts, id:oldest.id };
  });
}
function txSummaryHtml(txs){
  let inn = 0, out = 0;
  txs.forEach(t=>{ if (t.type === 'internal') return; if (t.amount > 0) inn += t.amount; else out += -t.amount; });
  return `<div class="small-note" style="margin:0 0 12px 0;"><b>${txs.length}</b> transaction${txs.length===1?'':'s'} · Money in <b class="mono" style="color:#2F5D3A;">+${money(inn)}</b> · Money out <b class="mono" style="color:var(--rust);">−${money(out)}</b> <span style="opacity:.8;">(moves between checking and savings aren't counted)</span></div>`;
}
function resetTxFilters(){
  Object.assign(uiState, { ledgerFilter:'', ledgerType:'all', ledgerSearch:'', ledgerFrom:'', ledgerTo:'', ledgerGroup:true, expandedTx:{},
                           actType:'all', actSearch:'', actFrom:'', actTo:'', actGroup:true, expandedStx:{} });
}

function ledgerTxRow(t, sub){
  const s = getStudent(t.studentId);
  const pos = t.amount >= 0;
  const cls = sub ? ' class="sub-row"' : '';
  if (uiState.editingLedgerTxId === t.id){
    return `<tr${cls}>

      <td colspan="2"><input type="number" step="0.01" id="editLedgerAmount" value="${(t.amount/100).toFixed(2)}" style="margin-bottom:0;"> <span class="small-note" style="display:inline;">(use a minus sign for a charge/expense)</span></td>
    </tr>
    <tr${cls}><td colspan="6" style="text-align:right;padding-top:0;">
      <button class="btn sm gold" data-save-ledger="${t.id}">Save</button>
      <button class="btn sm ghost" data-cancel-ledger="1">Cancel</button>
    </td></tr>`;
  }
  return `<tr${cls}>
    <td>${fmtDate(t.ts)}</td>
    <td>${s?escapeHtml(s.name):'—'}</td>
    <td>${escapeHtml(t.desc)}</td>
    <td><span class="pill ${pos?'income':'expense'}">${t.type}</span></td>
    <td class="mono ledger-amt ${pos?'pos':'neg'}">${pos?'+':''}${money(t.amount)}</td>

        <button class="icon-btn" data-del-ledger="${t.id}">✕</button></td>

}
function ledgerGroupRows(g){
  const st = getStudent(g.studentId);
  const open = !!uiState.expandedTx[g.id] || g.txs.some(t=>t.id===uiState.editingLedgerTxId);
  const first = (fmtDate(g.firstTs) !== fmtDate(g.ts)) ? ` · first bought ${fmtDate(g.firstTs)}` : '';
  let html = `<tr>
    <td>${fmtDate(g.ts)}</td>
    <td>${st?escapeHtml(st.name):'—'}</td>
    <td><b>${escapeHtml(g.item)} × ${g.qty}</b><div class="small-note" style="margin:2px 0 0 0;">${money(Math.abs(g.unit))} each${first}</div></td>
    <td><span class="pill expense">purchase</span></td>
    <td class="mono ledger-amt neg">${money(g.total)}</td>
    <td><button class="btn sm ghost" data-toggle-tx="${g.id}">${open?'Hide':'Details'}</button></td>
  </tr>`;
  if (open) html += g.txs.map(t=>ledgerTxRow(t, true)).join('');
  return html;
}
function ledgerResultsHtml(){
  const filterId = uiState.ledgerFilter || '';
  const base = db.transactions.filter(t=> !filterId || t.studentId===filterId);
  if (base.length === 0) return `<div class="empty">No transactions yet.</div>`;
  const txs = filterTransactions(base, { type:uiState.ledgerType, from:uiState.ledgerFrom, to:uiState.ledgerTo, search:uiState.ledgerSearch }, true);
  if (txs.length === 0) return `<div class="empty">No transactions match these filters.</div>`;
  const entries = groupTxsForDisplay(txs, uiState.ledgerGroup);
  const LIMIT = 300;
  const rows = entries.slice(0, LIMIT).map(e=> e.kind === 'group' ? ledgerGroupRows(e) : ledgerTxRow(e.tx, false)).join('');
  return `${txSummaryHtml(txs)}
    <table><thead><tr><th>Date</th><th>Student</th><th>Description</th><th>Type</th><th>Amount</th><th></th></tr></thead><tbody>${rows}</tbody></table>
    ${entries.length > LIMIT ? `<div class="small-note" style="margin-top:10px;">Showing the newest ${LIMIT} lines of ${entries.length}. Use the filters above to narrow it down.</div>` : ''}`;
}

    <div id="ledgerResults">${ledgerResultsHtml()}</div>

    b.onclick = ()=>{ const k = b.dataset.toggleTx; uiState.expandedTx[k] = !uiState.expandedTx[k]; refreshLedgerResults(); };

  document.querySelectorAll('[data-edit-ledger]').forEach(b=>{
    b.onclick = ()=>{ uiState.editingLedgerTxId = b.dataset.editLedger; render(); };
  });
  document.querySelectorAll('[data-cancel-ledger]').forEach(b=>{
    b.onclick = ()=>{ uiState.editingLedgerTxId = null; render(); };
  });
  document.querySelectorAll('[data-save-ledger]').forEach(b=>{
    b.onclick = async ()=>{
      const txId = b.dataset.saveLedger;
      const newAmount = toCents(document.getElementById('editLedgerAmount').value || '0');
      await refreshDb();
      const tx = db.transactions.find(t=>t.id===txId);
      if (!tx){ showToast('This transaction no longer exists'); uiState.editingLedgerTxId = null; render(); return; }
      const student = getStudent(tx.studentId);
      const account = tx.account || 'checking';
      const delta = newAmount - tx.amount;
      if (student && delta !== 0){
        if (account === 'savings') student.savings += delta; else student.checking += delta;
      }
      tx.amount = newAmount;
      uiState.editingLedgerTxId = null;
      await saveDbWithToast('Transaction updated'); render();
    };
  });
  document.querySelectorAll('[data-del-ledger]').forEach(b=>{
    b.onclick = async ()=>{
      if (!(await showConfirm("Delete this transaction? The student's balance will be adjusted to remove its effect. This does NOT undo linked transfers automatically — check the other side if this was a transfer."))) return;
      const txId = b.dataset.delLedger;
      await refreshDb();
      const idx = db.transactions.findIndex(t=>t.id===txId);
      if (idx===-1){ showToast('This transaction no longer exists'); render(); return; }
      const tx = db.transactions[idx];
      const student = getStudent(tx.studentId);
      const account = tx.account || 'checking';
      if (student){
        if (account === 'savings') student.savings -= tx.amount; else student.checking -= tx.amount;
      }
      db.transactions.splice(idx,1);
      await saveDbWithToast('Transaction deleted'); render();
    };
  });
}

function computeBalanceAudit(){
  const rows = [];
  db.students.forEach(st=>{
    ['checking','savings'].forEach(acct=>{
      const history = db.transactions.filter(t=>t.studentId===st.id && (t.account||'checking')===acct).reduce((a,t)=>a+t.amount,0);
      const diff = st[acct] - history;
      if (diff !== 0) rows.push({ student:st, account:acct, stored:st[acct], history, diff });
    });
  });
  return rows;
}

function bindSettings(){
  document.querySelectorAll('[data-fix-audit]').forEach(b=>{

      const [studentId, acct] = b.dataset.fixAudit.split(':');
      await refreshDb();

      const history = db.transactions.filter(t=>t.studentId===st.id && (t.account||'checking')===acct).reduce((a,t)=>a+t.amount,0);
      const diff = st[acct] - history;
      if (diff === 0){ showToast('Already matches'); render(); return; }

      await saveDbWithToast('Difference recorded'); render();
    };
  });

    await refreshDb();
    db.teacherPin = pin; await saveDbWithToast('PIN updated');
  };

    if (!(await showConfirm('This will permanently erase all classroom data. Continue?'))) return;
    db = defaultDb(); await saveDbWithToast('All data reset'); render();
  };
  document.getElementById('exportBackupBtn').onclick = async ()=>{
    await refreshDb(); // export the absolute latest data, not a possibly-stale local copy
    const stamp = new Date().toISOString().slice(0,16).replace('T','_').replace(':','-');
    const filename = `junior-bank-backup-${stamp}.json`;
    const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Backup downloaded');
  };
  document.getElementById('importBackupInput').onchange = async (e)=>{
    const file = e.target.files[0];
    if (!file) return;
    try{
      const text = await file.text();
      const parsed = JSON.parse(text);
      const looksLikeRealDb = parsed && Array.isArray(parsed.students) && Array.isArray(parsed.transactions);
      if (!looksLikeRealDb){
        showToast("That file doesn't look like a Junior Bank backup");
        e.target.value = '';
        return;
      }
      const studentCount = parsed.students.length;
      const ok = await showConfirm(`Import this backup? This will REPLACE all current data with the backup (${studentCount} student${studentCount===1?'':'s'} found). This cannot be undone.`);
      e.target.value = '';
      if (!ok) return;
      db = ensureShape(parsed);
      await saveDbWithToast('Backup restored');
      render();
    }catch(err){
      console.error('import failed', err);
      showToast("Could not read that file — make sure it's a Junior Bank backup .json file");
      e.target.value = '';
    }
  };
}

/* ---- Dashboard tab (charts) ---- */
let balanceChartInstance = null;
let expenseChartInstance = null;
const EXPENSE_CATEGORY_LABELS = {
  'bill-payment': 'Bills',
  'purchase': 'Store',
  'transfer-out': 'Sent to Classmates',
  'adjustment': 'Adjustments'
};
const EXPENSE_CATEGORY_COLORS = {
  'Bills': '#CC8670',
  'Store': '#DDA85B',
  'Sent to Classmates': '#7C9A73',
  'Adjustments': '#A99A85'
};
function monthKey(ts){ const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(key){ const [y,m]=key.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'}); }
function dayLabel(ts){ const d=new Date(ts); return (d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear(); }

function renderStudentDashboard(){
  const s = currentStudent();
  const myTx = db.transactions.filter(t=>t.studentId===s.id).sort((a,b)=>a.ts-b.ts);
  const monthKeys = [...new Set(myTx.map(t=>monthKey(t.ts)))].sort();
  const selected = uiState.dashboardMonth || 'all';
  const monthOptions = `<option value="all" ${selected==='all'?'selected':''}>All months</option>` +
    monthKeys.map(k=>`<option value="${k}" ${selected===k?'selected':''}>${monthLabel(k)}</option>`).join('');

  // filter window
  let rangeStart = -Infinity, rangeEnd = Infinity;
  if (selected !== 'all'){
    const [y,m] = selected.split('-').map(Number);
    rangeStart = new Date(y, m-1, 1).getTime();
    rangeEnd = new Date(y, m, 1).getTime() - 1;
  }
  const inRange = t => t.ts >= rangeStart && t.ts <= rangeEnd;

  // expenses total for the selected window
  const expenseTypes = Object.keys(EXPENSE_CATEGORY_LABELS);
  const expenseTx = myTx.filter(t => inRange(t) && t.amount < 0 && expenseTypes.includes(t.type));
  const totalExpenses = expenseTx.reduce((a,t)=>a+Math.abs(t.amount),0);

  // expense breakdown by category
  const byCat = {};
  expenseTx.forEach(t=>{
    const label = EXPENSE_CATEGORY_LABELS[t.type] || 'Other';
    byCat[label] = (byCat[label]||0) + Math.abs(t.amount);
  });

  // balance history: running totals per account, sampled at each event day, within range (carrying in prior balance)
  function seriesFor(account){
    // Start from whatever the recorded transactions don't explain (normally $0), so the
    // line always finishes at the balance shown on the account.
    const stored = account === 'savings' ? s.savings : s.checking;
    const explained = myTx.filter(t=>t.account === account).reduce((a,t)=>a+t.amount,0);
    let bal = stored - explained; const beforeRange = [];
    const points = [];
    myTx.forEach(t=>{
      if (t.account !== account) return;
      bal += t.amount;
      if (t.ts < rangeStart) beforeRange.push(bal);
      if (inRange(t)) points.push({ ts:t.ts, bal });
    });
    const carryIn = beforeRange.length ? beforeRange[beforeRange.length-1] : 0;
    return { carryIn, points };
  }
  const checkingSeries = seriesFor('checking');
  const savingsSeries = seriesFor('savings');
  const allDays = [...new Set([...checkingSeries.points, ...savingsSeries.points].map(p=>dayLabel(p.ts)))]
    .sort((a,b)=>{
      const [am,ad,ay]=a.split('/').map(Number), [bm,bd,by]=b.split('/').map(Number);
      return new Date(ay,am-1,ad) - new Date(by,bm-1,bd);
    });
  function buildStepData(series, days){
    let bal = series.carryIn;
    const dayToLast = {};
    series.points.forEach(p=>{ dayToLast[dayLabel(p.ts)] = p.bal; });
    return days.map(day=>{ if (dayToLast[day] !== undefined) bal = dayToLast[day]; return bal; });
  }
  const labels = allDays.length ? allDays : ['No activity yet'];
  const checkingData = allDays.length ? buildStepData(checkingSeries, allDays) : [s.checking];
  const savingsData = allDays.length ? buildStepData(savingsSeries, allDays) : [s.savings];

  // amounts are stored in cents; charts are drawn in dollars
  const toDollars = arr => arr.map(c=>c/100);
  window.__dashboardChartData = {
    labels, checkingData: toDollars(checkingData), savingsData: toDollars(savingsData),
    expenseLabels: Object.keys(byCat), expenseData: toDollars(Object.values(byCat))
  };

  return `
  <div class="card">
    <div class="dash-header">
      <h3 style="margin:0;">${escapeHtml(s.name)}'s Dashboard</h3>
      <div class="dash-filter"><label style="display:inline;margin-right:8px;text-transform:none;font-size:12.5px;">View</label>
        <select id="dashboardMonthSelect">${monthOptions}</select>
      </div>
    </div>
    <div class="dash-summary">
      <div class="dash-stat"><div class="dl">Checking</div><div class="dv checking" style="${s.checking<0?'color:var(--rust);':''}">${money(s.checking)}</div></div>
      <div class="dash-stat"><div class="dl">Savings</div><div class="dv savings">${money(s.savings)}</div></div>
      <div class="dash-stat"><div class="dl">Expenses${selected==='all'?' (all time)':''}</div><div class="dv expenses">${money(totalExpenses)}</div></div>
    </div>
  </div>
  <div class="card">
    <div class="chart-grid">
      <div>
        <h3>Account Balances Over Time</h3>
        <div class="chart-box"><canvas id="balanceChart"></canvas></div>
      </div>
      <div>
        <h3>Expenses Breakdown</h3>
        <div class="chart-box">${Object.keys(byCat).length===0 ? `<div class="empty">No expenses in this period.</div>` : `<canvas id="expenseChart"></canvas>`}</div>
      </div>
    </div>
  </div>`;
}

  const sel = document.getElementById('dashboardMonthSelect');
  sel.onchange = ()=>{ uiState.dashboardMonth = sel.value; render(); };

  if (document.fonts && document.fonts.load){
    const go = ()=>{ if (document.getElementById('balanceChart')) drawCharts(); };
    Promise.all([document.fonts.load("11px 'IBM Plex Mono'"), document.fonts.load("12px 'Poppins'")]).then(go).catch(go);
  } else {
    drawCharts();
  }

    <div class="small-note">Available in checking: <b class="mono">${money(s.checking)}</b></div>
    <label>Send to</label>
    <select id="sendToSelect">${others.map(o=>`<option value="${o.id}" ${o.id===preselect?'selected':''}>${escapeHtml(o.name)}</option>`).join('')}</select>
    <label>Amount ($)</label>
    <input type="number" step="0.01" id="sendAmount" placeholder="1.00">
    <label>What's it for? (optional)</label>
    <input type="text" id="sendNote" placeholder="e.g. Splitting snack money">
    <button class="btn gold" id="sendMoneyBtn">Send</button>
  </div>`;
}
function bindSendMoney(){
  uiState.sendPreselect = null;
  document.getElementById('sendMoneyBtn').onclick = async ()=>{
    const toId = document.getElementById('sendToSelect').value;
    const amt = toCents(document.getElementById('sendAmount').value || '0');
    const note = document.getElementById('sendNote').value.trim();
    if (amt<=0){ showToast('Choose a recipient and amount'); return; }
    await refreshDb();
    const s = currentStudent();
    const to = getStudent(toId);
    if (!to){ showToast('Choose a recipient and amount'); return; }
    if (amt > s.checking){ showToast('Not enough in checking'); return; }
    s.checking -= amt; to.checking += amt;
    addTx(s.id,'transfer-out',-amt, note?`To ${to.name} — ${note}`:`To ${to.name}`);
    addTx(to.id,'transfer-in',amt, note?`From ${s.name} — ${note}`:`From ${s.name}`);
    await saveDbWithToast(`Sent ${money(amt)} to ${to.name}`); render();
  };
}

function renderStudentBills(){
  const s = currentStudent();
  const unpaid = db.charges.filter(c=>c.studentId===s.id && !c.paid).sort((a,b)=>a.createdAt-b.createdAt);
  const paid = db.charges.filter(c=>c.studentId===s.id && c.paid).sort((a,b)=>b.paidAt-a.paidAt).slice(0,10);
  return `
  <div class="card">
    <h3>Bills to pay</h3>
    ${unpaid.length===0 ? `<div class="empty">No unpaid bills — nice work!</div>` :
      unpaid.map(c=>`<div class="ledger-row"><span>${escapeHtml(c.billName)}</span>
        <span style="display:flex;align-items:center;gap:10px;">
          <span class="ledger-amt neg">${money(c.amount)}</span>
          <button class="btn sm gold" data-pay-charge="${c.id}">Pay</button>
        </span></div>`).join('')}
  </div>
  <div class="card">
    <h3>Recently paid</h3>
    ${paid.length===0 ? `<div class="empty">Nothing paid yet.</div>` :
      paid.map(c=>`<div class="ledger-row"><span>${escapeHtml(c.billName)} <span class="stamp">Paid</span></span><span class="ledger-amt neg">${money(c.amount)}</span></div>`).join('')}
  </div>`;
}
function bindStudentBills(){
  document.querySelectorAll('[data-pay-charge]').forEach(b=>{
    b.onclick = async ()=>{
      const chargeId = b.dataset.payCharge;
      await refreshDb();
      const s = currentStudent();
      const c = db.charges.find(x=>x.id===chargeId);
      if (!c){ showToast('This bill no longer exists'); render(); return; }
      if (c.paid){ showToast('This bill was already paid'); render(); return; }
      const willBeNegative = c.amount > s.checking;
      s.checking -= c.amount; c.paid = true; c.paidAt = nowTs();
      addTx(s.id,'bill-payment',-c.amount,`Paid: ${c.billName}`);
      await saveDbWithToast(willBeNegative ? `Paid ${escapeHtml(c.billName)} — checking is now negative` : `Paid ${escapeHtml(c.billName)}`);
      render();
    };
  });
}

function storeVisibleItems(){
  return db.storeItems.filter(it=> it.stock===null || it.stock>0);
}
function isUncategorized(it){
  return !it.categoryId || !db.storeCategories.some(c=>c.id===it.categoryId);
}
function storeCardHtml(it, s){
  return `
    <div class="store-item">
      ${it.image ? `<img class="ithumb" src="${it.image}">` : `<div class="ithumb-placeholder">No photo</div>`}
      <div class="iname">${escapeHtml(it.name)}</div>
      <div class="iprice">${money(it.price)}</div>
      <div class="istock">${it.stock===null?'In stock':it.stock+' left'}</div>
      <button class="btn sm gold" data-buy-item="${it.id}" ${it.price>s.checking?'disabled':''}>Buy</button>
    </div>`;
}
function storeTabsHtml(){
  if (db.storeCategories.length === 0) return '';
  const all = storeVisibleItems();
  const sel = uiState.storeCategory || 'all';
  const tab = (key,label,n)=>`<button class="cat-tab ${sel===key?'active':''}" data-store-cat="${key}">${escapeHtml(label)} <span class="cat-count">${n}</span></button>`;
  let html = tab('all','All',all.length);
  db.storeCategories.forEach(c=>{
    const n = all.filter(it=>it.categoryId===c.id).length;
    if (n > 0) html += tab(c.id, c.name, n);
  });
  const other = all.filter(isUncategorized).length;
  if (other > 0) html += tab('none','Other',other);
  return `<div class="cat-tabs">${html}</div>`;
}
function storeGridHtml(s){
  const all = storeVisibleItems();
  const q = (uiState.storeSearch || '').trim().toLowerCase();
  const sel = uiState.storeCategory || 'all';
  let items = all.filter(it=> !q || it.name.toLowerCase().includes(q));
  if (sel === 'none') items = items.filter(isUncategorized);
  else if (sel !== 'all') items = items.filter(it=>it.categoryId===sel);
  if (items.length === 0){
    return `<div class="empty">${all.length===0 ? 'The store is empty right now.' : 'Nothing matches — try another section or a different search.'}</div>`;
  }
  // "All" view with sections set up: show each section under its own heading
  if (sel === 'all' && db.storeCategories.length > 0){
    let html = '';
    db.storeCategories.forEach(c=>{
      const group = items.filter(it=>it.categoryId===c.id);
      if (group.length) html += `<div class="store-section-title">${escapeHtml(c.name)}</div><div class="store-grid">${group.map(it=>storeCardHtml(it,s)).join('')}</div>`;
    });
    const other = items.filter(isUncategorized);
    if (other.length) html += `<div class="store-section-title">Other</div><div class="store-grid">${other.map(it=>storeCardHtml(it,s)).join('')}</div>`;
    return html;
  }
  return `<div class="store-grid">${items.map(it=>storeCardHtml(it,s)).join('')}</div>`;
}
function renderStudentStore(){
  const s = currentStudent();
  // if the section they were viewing no longer has anything in it, go back to "All"
  const sel = uiState.storeCategory || 'all';
  if (sel !== 'all'){
    const all = storeVisibleItems();
    const stillThere = sel === 'none' ? all.some(isUncategorized) : all.some(it=>it.categoryId===sel);
    if (!stillThere) uiState.storeCategory = 'all';
  }
  const purchases = groupTxsForDisplay(db.transactions.filter(t=>t.studentId===s.id && t.type==='purchase'), true);
  return `
  <div class="card">
    <div class="flex-between"><h3 style="margin:0;">Class Store</h3><div class="small-note" style="margin:0;">Checking: <b class="mono">${money(s.checking)}</b></div></div>
  </div>
  <div class="card">
    <input type="text" id="storeSearch" placeholder="Search the store…" value="${escapeHtml(uiState.storeSearch||'')}">
    ${storeTabsHtml()}
    <div id="storeGrid">${storeGridHtml(s)}</div>
  </div>
  <div class="card">
    <h3>My Purchases</h3>
    ${purchases.length===0 ? `<div class="empty">You haven't bought anything yet.</div>` :
      purchases.map(e=> e.kind==='group'
        ? `<div class="ledger-row"><span><b>${escapeHtml(e.item)} × ${e.qty}</b> <span class="small-note" style="margin:0;">— last bought ${fmtDate(e.ts)}</span></span><span class="ledger-amt neg">${money(e.total)}</span></div>`
        : `<div class="ledger-row"><span>${escapeHtml(itemNameOf(e.tx))} <span class="small-note" style="margin:0;">— ${fmtDate(e.ts)}</span></span><span class="ledger-amt neg">${money(e.tx.amount)}</span></div>`).join('')}
  </div>`;
}
function bindBuyButtons(){
  document.querySelectorAll('[data-buy-item]').forEach(b=>{
    b.onclick = async ()=>{
      const itemId = b.dataset.buyItem;
      await refreshDb();
      const s = currentStudent();
      const it = db.storeItems.find(x=>x.id===itemId);
      if (!it){ showToast('That item is no longer available'); render(); return; }
      if (it.stock!==null && it.stock<=0){ showToast('Out of stock'); render(); return; }
      if (it.price > s.checking){ showToast('Not enough in checking'); render(); return; }
      s.checking -= it.price;
      if (it.stock!==null) it.stock -= 1;
      addTx(s.id,'purchase',-it.price,`Bought: ${it.name}`);
      await saveDbWithToast(`Bought ${it.name}`); render();
    };
  });
}
function bindStudentStore(){
  bindBuyButtons();
  document.querySelectorAll('[data-store-cat]').forEach(b=>{
    b.onclick = ()=>{ uiState.storeCategory = b.dataset.storeCat; render(); };
  });
  const search = document.getElementById('storeSearch');
  if (search){
    search.oninput = ()=>{
      uiState.storeSearch = search.value;
      document.getElementById('storeGrid').innerHTML = storeGridHtml(currentStudent());
      bindBuyButtons();
    };
  }
}

function renderStudentTransfer(){
  const s = currentStudent();
  return `
  <div class="card">
    <h3>Move money between accounts</h3>
    <div class="grid2">
      <div><div class="small-note">Checking</div><div class="mono" style="font-size:20px;">${money(s.checking)}</div></div>
      <div><div class="small-note">Savings</div><div class="mono" style="font-size:20px;">${money(s.savings)}</div></div>
    </div>
    <label>Amount ($)</label>
    <input type="number" step="0.01" id="transferAmount" placeholder="1.00">
    <div class="row-inline">
      <button class="btn gold" id="toSavingsBtn">Checking → Savings</button>
      <button class="btn ghost" id="toCheckingBtn">Savings → Checking</button>
    </div>
  </div>`;
}
function bindStudentTransfer(){
  document.getElementById('toSavingsBtn').onclick = async ()=>{
    const amt = toCents(document.getElementById('transferAmount').value || '0');
    if (amt<=0){ showToast('Enter an amount'); return; }
    await refreshDb();
    const s = currentStudent();
    if (amt>s.checking){ showToast('Not enough in checking'); return; }
    s.checking -= amt; s.savings += amt;
    addTx(s.id,'internal',-amt,'Transfer to savings','checking');
    addTx(s.id,'internal',amt,'Transfer to savings (deposit)','savings');
    await saveDbWithToast('Moved to savings'); render();
  };
  document.getElementById('toCheckingBtn').onclick = async ()=>{
    const amt = toCents(document.getElementById('transferAmount').value || '0');
    if (amt<=0){ showToast('Enter an amount'); return; }
    await refreshDb();
    const s = currentStudent();
    if (amt>s.savings){ showToast('Not enough in savings'); return; }
    s.savings -= amt; s.checking += amt;
    addTx(s.id,'internal',-amt,'Transfer to checking','savings');
    addTx(s.id,'internal',amt,'Transfer to checking (deposit)','checking');
    await saveDbWithToast('Moved to checking'); render();
  };
}

function activityResultsHtml(st){
  const base = db.transactions.filter(t=>t.studentId===st.id);
  if (base.length === 0) return `<div class="empty">No activity yet.</div>`;
  const txs = filterTransactions(base, { type:uiState.actType, from:uiState.actFrom, to:uiState.actTo, search:uiState.actSearch }, false);
  if (txs.length === 0) return `<div class="empty">Nothing matches these filters.</div>`;
  const entries = groupTxsForDisplay(txs, uiState.actGroup);
  const rows = entries.map(e=>{
    if (e.kind === 'single'){
      const t = e.tx;
      return `<div class="ledger-row"><span>${fmtDate(t.ts)} — ${escapeHtml(t.desc)}</span><span class="ledger-amt ${t.amount>=0?'pos':'neg'}">${t.amount>=0?'+':''}${money(t.amount)}</span></div>`;
    }
    const open = !!uiState.expandedStx[e.id];
    let html = `<div class="ledger-row">
      <span><b>${escapeHtml(e.item)} × ${e.qty}</b> <span class="small-note" style="margin:0;">${money(Math.abs(e.unit))} each · last bought ${fmtDate(e.ts)}</span></span>
      <span style="display:flex;align-items:center;gap:10px;"><span class="ledger-amt neg">${money(e.total)}</span><button class="btn sm ghost" data-toggle-stx="${e.id}">${open?'Hide':'Details'}</button></span>
    </div>`;
    if (open) html += e.txs.map(t=>`<div class="ledger-row sub-line"><span>${fmtDate(t.ts)}</span><span class="ledger-amt neg">${money(t.amount)}</span></div>`).join('');
    return html;
  }).join('');
  return txSummaryHtml(txs) + rows;
}
function renderStudentActivity(){
  const st = currentStudent();
  return `
  <div class="card">
    <h3>Find a transaction</h3>
    <div class="grid3">
      <div><label>Type</label><select id="actType">${txTypeOptionsHtml(uiState.actType)}</select></div>
      <div><label>From</label><input type="date" id="actFrom" value="${uiState.actFrom||''}"></div>
      <div><label>To</label><input type="date" id="actTo" value="${uiState.actTo||''}"></div>
    </div>
    <div class="grid2">
      <div><label>Search</label><input type="text" id="actSearch" placeholder="Item, bill, or name…" value="${escapeHtml(uiState.actSearch||'')}"></div>
      <div style="padding-top:22px;">
        <label class="checkline"><input type="checkbox" id="actGroup" ${uiState.actGroup?'checked':''}> Combine repeat purchases</label>
        <button class="btn sm ghost" id="actClear">Clear filters</button>
      </div>
    </div>
  </div>
  <div class="card">
    <h3>History</h3>
    <div id="activityResults">${activityResultsHtml(st)}</div>
  </div>`;
}
function bindStudentActivity(){
  const refresh = ()=>{
    const box = document.getElementById('activityResults');
    if (!box) return;
    box.innerHTML = activityResultsHtml(currentStudent());
    bindRows();
  };
  const bindRows = ()=>{
    document.querySelectorAll('[data-toggle-stx]').forEach(b=>{
      b.onclick = ()=>{ const k = b.dataset.toggleStx; uiState.expandedStx[k] = !uiState.expandedStx[k]; refresh(); };
    });
  };
  const type = document.getElementById('actType');   type.onchange = ()=>{ uiState.actType = type.value; refresh(); };
  const from = document.getElementById('actFrom');   from.onchange = from.oninput = ()=>{ uiState.actFrom = from.value; refresh(); };
  const to = document.getElementById('actTo');       to.onchange = to.oninput = ()=>{ uiState.actTo = to.value; refresh(); };
  const search = document.getElementById('actSearch'); search.oninput = ()=>{ uiState.actSearch = search.value; refresh(); };
  const grp = document.getElementById('actGroup');   grp.onchange = ()=>{ uiState.actGroup = grp.checked; refresh(); };
  document.getElementById('actClear').onclick = ()=>{ resetTxFilters(); render(); };
  bindRows();
}

function bindStudentTab(tab){
  if (tab==='dashboard') bindStudentDashboard();
  if (tab==='household') bindStudentHousehold();
  if (tab==='send') bindSendMoney();
  if (tab==='bills') bindStudentBills();
  if (tab==='store') bindStudentStore();
  if (tab==='transfer') bindStudentTransfer();
  if (tab==='activity') bindStudentActivity();
}
function bindStudentHousehold(){
  document.querySelectorAll('[data-quick-send]').forEach(b=>{
    b.onclick = ()=>{
      uiState.sendPreselect = b.dataset.quickSend;
      uiState.studentTab = 'send';
      render();
    };
  });
}

/* ---------------- boot ---------------- */
(async function init(){
  document.getElementById('app').innerHTML = `<div class="login-wrap"><div class="login-sub">Loading Junior Bank…</div></div>`;
  await loadDb();
  render();
})();
</script>
