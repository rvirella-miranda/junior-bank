    background-size:cover;
    background-position:center top;
    background-repeat:no-repeat;
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Nunito',sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.display{ font-family:'Quicksand',sans-serif; font-weight:600; letter-spacing:-0.01em;}
  .mono{ font-family:'IBM Plex Mono',monospace; }
  button{ font-family:'Nunito',sans-serif; cursor:pointer; }
  input,select{ font-family:'Nunito',sans-serif; }

  /* ---------- layout shells ---------- */
  #app{ min-height:100vh; display:flex; flex-direction:column;}
  .topbar{
    background:linear-gradient(135deg, var(--teal), var(--teal-light)); color:var(--paper); padding:14px 22px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:3px solid var(--gold); box-shadow:0 2px 12px rgba(74,64,56,.10);
  }
  .topbar .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:36px;height:36px;border-radius:12px;background:var(--gold);
    display:flex;align-items:center;justify-content:center;color:var(--teal);
    font-family:'Quicksand'; font-weight:700; font-size:16px;
    box-shadow:0 2px 6px rgba(0,0,0,.12);
  }
  .brand-title{ font-size:18px; }
  .brand-sub{ font-size:11px; opacity:.75; letter-spacing:.06em; text-transform:uppercase; }
  .topbar-right{ display:flex; align-items:center; gap:14px; font-size:13px;}
  .logout-btn{
    background:transparent;border:1px solid rgba(250,243,225,.4); color:var(--paper);
    padding:6px 12px; border-radius:20px; font-size:12px;
  }
  .logout-btn:hover{ background:rgba(250,243,225,.12); }

  .tabs{
    display:flex; gap:2px; background:rgba(244,234,216,0.85); padding:0 16px;
    border-bottom:1px solid var(--line); overflow-x:auto;
  }
  .tab{
    padding:12px 16px; font-size:13.5px; font-weight:500; color:#6b6250;
    border-bottom:3px solid transparent; white-space:nowrap; background:none; border-top:none; border-left:none; border-right:none;
  }
  .tab.active{ color:var(--teal); border-bottom-color:var(--gold); font-weight:700; border-radius:8px 8px 0 0; background:rgba(255,255,255,.5); }

  .content{ flex:1; padding:22px; max-width:1100px; width:100%; margin:0 auto; }

  .card{
    background:var(--white); border:1px solid var(--line); border-radius:18px;
    padding:20px; margin-bottom:18px; box-shadow:0 4px 18px rgba(74,64,56,.06);
  }
  .card h3{ margin:0 0 12px 0; font-size:15px; color:var(--teal); }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  @media (max-width:720px){ .grid2,.grid3{ grid-template-columns:1fr; } }

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="confirm-overlay" id="confirmModal" style="display:none;">
  <div class="confirm-box">
    <div class="confirm-message" id="confirmModalMessage"></div>
    <div class="confirm-actions">
      <button class="btn ghost" id="confirmModalNo">Cancel</button>
      <button class="btn rust" id="confirmModalYes">Yes, do it</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   JUNIOR BANK — classroom economy app
   Data is saved through a small Google Apps Script "backend" so it
   works with no Claude account, on any device with a browser — see
   BACKEND_URL below and the setup guide provided alongside this file.
   ========================================================= */

const STORAGE_KEY = 'junior-bank-db-v1';

/* ============================================================
   PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL BELOW
   (see "Junior Bank – Backend Setup Guide" for how to get this).
   Leave blank to preview locally — but nothing will be saved or
   shared with students until this is filled in.
   ============================================================ */
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbyQOA0iboIoaj6nkrVNn1U5ip-aKO2Iig29BYnEIdIgFxkHyD9xrydQWPpGcfOeolZs/exec';

const defaultDb = () => ({
  teacherPin: '1234',
  students: [],      // {id,name,pin,jobTitle,payAmount,payFreq,householdId,checking,savings}
  households: [],     // {id,name}
  bills: [],           // {id,name,amount,freq,targetType,targetId} freq: 'one-time'|'weekly'|'biweekly'|'monthly'
  charges: [],         // {id,billId,billName,studentId,amount,paid,createdAt,paidAt}
  storeItems: [],      // {id,name,price,stock} stock:null = unlimited
  transactions: []     // {id,ts,studentId,type,amount,desc}
});

let db = null;
let session = { role: null, studentId: null }; // role: 'teacher' | 'student'
let uiState = { teacherTab:'students', studentTab:'home', loginRole:'student', loginError:'', editingChargeId:null, editingPayrollId:null, billTargetMode:'student', editingLedgerTxId:null, ledgerFilter:'', editingBillId:null, editingStoreItemId:null };
let backendMode = 'none'; // 'appsscript' | 'claude-storage' | 'none'
let backendLoadError = '';
let backendLoadFailed = false; // true if the initial fetch from the backend failed — blocks saving to prevent overwriting real data with a blank session

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }
function money(cents){
  const neg = cents < 0;
  const v = (Math.abs(cents)/100).toFixed(2);
  return (neg?'-':'') + '$' + v;
}
function toCents(dollarsStr){
  const n = parseFloat(dollarsStr);
  if (isNaN(n)) return 0;
  return Math.round(n*100);
}
function nowTs(){ return Date.now(); }
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' ' + d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
}
function showConfirm(message){
  return new Promise(resolve=>{
    const overlay = document.getElementById('confirmModal');
    document.getElementById('confirmModalMessage').textContent = message;
    overlay.style.display = 'flex';
    const yesBtn = document.getElementById('confirmModalYes');
    const noBtn = document.getElementById('confirmModalNo');
    const cleanup = (result)=>{
      overlay.style.display = 'none';
      yesBtn.onclick = null; noBtn.onclick = null;
      resolve(result);
    };
    yesBtn.onclick = ()=> cleanup(true);
    noBtn.onclick = ()=> cleanup(false);
  });
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> t.classList.remove('show'), 2200);
}
function resizeImageFile(file, maxDim){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error('read failed'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('image decode failed'));
      img.onload = ()=>{
        let { width, height } = img;
        if (width > height){ if (width > maxDim){ height = Math.round(height*maxDim/width); width = maxDim; } }
        else { if (height > maxDim){ width = Math.round(width*maxDim/height); height = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/**
 * Pulls the absolute latest saved data from the backend and replaces the
 * local `db` with it. Every action that changes a balance calls this FIRST,
 * right before reading/mutating anything — so it's always working from a
 * snapshot that's at most a fraction of a second old, instead of possibly
 * many minutes old (e.g. a Chromebook tab someone left open). This is what
 * prevents one student's save from silently erasing another's change that
 * happened moments earlier on a different device.
 */
async function refreshDb(){
  if (backendMode !== 'appsscript' || !BACKEND_URL) return; // nothing shared to refresh from
  try{
    const res = await fetch(BACKEND_URL);
    const json = await res.json();
    if (json && json.value){
      const parsed = JSON.parse(json.value);
      if (parsed && Array.isArray(parsed.students) && Array.isArray(parsed.transactions)){
        db = parsed;
      }
    }
  }catch(e){
    console.error('refresh before save failed', e);
    // Keep working with whatever local db we have; saveDb() below will
    // still attempt to persist it rather than silently losing the action.
  }
}

async function loadDb(){
  // 1) Preferred: a configured Google Apps Script backend — works for
  //    anyone with the link, no Claude or Google login required.
  if (BACKEND_URL){
    try{
      const res = await fetch(BACKEND_URL);
      if (!res.ok) throw new Error('The backend answered with HTTP status ' + res.status);
      const rawText = await res.text();
      let json = null;
      try { json = JSON.parse(rawText); }
      catch(jsonErr){ throw new Error('The backend returned a web page instead of data (starts with: ' + rawText.slice(0,80).replace(/\s+/g,' ') + ')'); }
      let parsed = null;
      if (json && json.value){
        try { parsed = JSON.parse(json.value); } catch(parseErr){ parsed = null; }
      }
      // Only treat this as "nothing saved yet" if the data doesn't even
      // look like a real database — never overwrite real data just because
      // a field happened to be empty or a request hiccupped.
      const looksLikeRealDb = parsed && Array.isArray(parsed.students) && Array.isArray(parsed.transactions);
      backendMode = 'appsscript';
      if (looksLikeRealDb){
        db = parsed;
      } else {
        db = defaultDb();
        await saveDb(); // safe: only runs on a genuinely first-ever load
      }
      return;
    }catch(e){
      // Network/backend error: do NOT overwrite anything remotely. Show a
      // blank local session so nothing looks silently fine, but the real
      // data on the server is left completely untouched.
      console.error('backend load failed', e);
      db = defaultDb();
      backendMode = 'appsscript';
      backendLoadFailed = true;
      backendLoadError = (e && e.message) ? e.message : String(e);
      showToast('Could not reach the backend — your saved data is safe, but not loaded this time. Check your connection and reload.');
      return;
    }
  }
  // 2) Fallback for previewing inside Claude only (not shared with students)
  if (typeof window.storage !== 'undefined'){
    try{
      const res = await window.storage.get(STORAGE_KEY, true);
      db = JSON.parse(res.value);
    }catch(e){
      db = defaultDb();
    }
    backendMode = 'claude-storage';
    return;
  }
  // 3) No backend configured at all — in-memory only for this tab
  db = defaultDb();
  backendMode = 'none';
}
async function saveDb(){
  if (backendLoadFailed){
    showToast("Not connected to your saved data right now — reload the page before making changes.");
    return false;
  }
  try{
    if (backendMode === 'appsscript' && BACKEND_URL){
      // Sent as text/plain on purpose (no custom headers) so the browser
      // treats this as a "simple request" and Apps Script accepts it directly.
      const res = await fetch(BACKEND_URL, { method:'POST', body: JSON.stringify({ value: JSON.stringify(db) }) });
      if (!res.ok) throw new Error('Backend responded with HTTP ' + res.status);
      const json = await res.json().catch(()=>null);
      if (!json || json.ok !== true) throw new Error('Backend did not confirm the save');
      return true;
    } else if (backendMode === 'claude-storage' && typeof window.storage !== 'undefined'){
      await window.storage.set(STORAGE_KEY, JSON.stringify(db), true);
      return true;
    }
    // backendMode === 'none' -> nothing persists between reloads; that's expected until setup is complete
    return true;
  }catch(e){
    console.error('save failed', e);
    showToast("Couldn't save — your last change may be lost if you leave this page. Check your connection and try again.");
    return false;
  }
}
/**
 * Saves, and only shows the success message if the save actually succeeded.
 * Use this instead of "await saveDb(); showToast('...')" everywhere a user
 * action needs feedback — otherwise a failed save gets silently masked by
 * a success toast that fires right after it, regardless of what happened.
 */
async function saveDbWithToast(successMessage){
  const ok = await saveDb();
  if (ok) showToast(successMessage);
  return ok;
}
function addTx(studentId, type, amountCents, desc, account){
  db.transactions.push({ id:uid('tx'), ts:nowTs(), studentId, type, amount:amountCents, desc, account: account || 'checking' });
}
function getStudent(id){ return db.students.find(s=>s.id===id); }
function getHousehold(id){ return db.households.find(h=>h.id===id); }

/* ---------------- rendering ---------------- */
function render(){
  const app = document.getElementById('app');
  if (backendLoadFailed){
    app.innerHTML = `
      <div class="login-wrap">
        <div class="login-card" style="text-align:center;">
          <div class="login-mark" style="background:var(--rust);">!</div>
          <div class="login-title">Couldn't connect</div>
          <div class="login-sub">We couldn't reach your saved classroom data. Nothing has been changed or lost — reload to try again.</div>
          <div class="small-note" style="margin:0 0 14px 0;word-break:break-word;">Technical detail: ${escapeHtml(backendLoadError || 'unknown')}</div>
          <button class="btn gold" id="retryConnectBtn" style="width:100%;justify-content:center;">Try again</button>
        </div>
      </div>`;
    document.getElementById('retryConnectBtn').onclick = ()=> location.reload();
    return;
  }
  if (!session.role){
    app.innerHTML = renderLogin();
    bindLogin();
    return;
  }
  if (session.role === 'teacher'){
    app.innerHTML = renderTeacherShell();
    bindTeacherShell();
    return;
  }
  if (session.role === 'student'){
    app.innerHTML = renderStudentShell();
    bindStudentShell();
    return;
  }
}

/* ---------------- LOGIN ---------------- */
function renderLogin(){
  const isTeacher = uiState.loginRole === 'teacher';
  const studentOptions = db.students.slice().sort((a,b)=>a.name.localeCompare(b.name))
    .map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');
  const setupBanner = backendMode !== 'appsscript' ? `
    <div style="max-width:420px;margin:0 auto 14px auto;background:#fdf3e2;border:1px solid var(--gold);border-radius:14px;padding:12px 16px;font-size:12.5px;color:var(--ink);">
      ⚠️ <b>Setup needed:</b> ${backendMode==='claude-storage' ? "You're in preview mode — students won't see this data yet." : "Nothing is being saved yet."} Add your Google Apps Script URL to the file — see the setup guide.
    </div>` : '';
  return `
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">JB</div>
      <div><div class="brand-title">Junior Bank</div><div class="brand-sub">Classroom Economy</div></div>
    </div>
  </div>
  <div class="login-wrap" style="flex-direction:column;">
    ${setupBanner}
    <div class="login-card">
      <div class="login-mark">JB</div>
      <div class="login-title">Welcome back</div>
      <div class="login-sub">Sign in to manage your money</div>
      <div class="role-toggle">
        <button id="roleStudentBtn" class="${!isTeacher?'active':''}">Student</button>
        <button id="roleTeacherBtn" class="${isTeacher?'active':''}">Teacher</button>
      </div>
      ${isTeacher ? `
        <label>Teacher PIN</label>
        <input type="password" id="teacherPinInput" placeholder="Enter PIN" inputmode="numeric">
        ${uiState.loginError ? `<div class="error-msg">${uiState.loginError}</div>` : ''}
        <button class="btn gold" id="teacherLoginBtn" style="width:100%;justify-content:center;">Sign in as Teacher</button>
      ` : `
        ${db.students.length === 0 ? `<div class="empty">No students yet. Ask your teacher to add the roster.</div>` : `
        <label>Your Name</label>
        <select id="studentSelect">${studentOptions}</select>
        <label>Your PIN</label>
        <input type="password" id="studentPinInput" placeholder="Enter PIN" inputmode="numeric">
        ${uiState.loginError ? `<div class="error-msg">${uiState.loginError}</div>` : ''}
        <button class="btn" id="studentLoginBtn" style="width:100%;justify-content:center;">Sign in</button>
        `}
      `}
    </div>
  </div>`;
}
function bindLogin(){
  document.getElementById('roleStudentBtn').onclick = ()=>{ uiState.loginRole='student'; uiState.loginError=''; render(); };
  document.getElementById('roleTeacherBtn').onclick = ()=>{ uiState.loginRole='teacher'; uiState.loginError=''; render(); };
  const tBtn = document.getElementById('teacherLoginBtn');
  if (tBtn) tBtn.onclick = ()=>{
    const pin = document.getElementById('teacherPinInput').value.trim();
    if (pin === db.teacherPin){ session.role='teacher'; uiState.loginError=''; render(); }
    else { uiState.loginError = 'Incorrect PIN.'; render(); }
  };
  const sBtn = document.getElementById('studentLoginBtn');
  if (sBtn) sBtn.onclick = ()=>{
    const id = document.getElementById('studentSelect').value;
    const pin = document.getElementById('studentPinInput').value.trim();
    const s = getStudent(id);
    if (s && pin === s.pin){ session.role='student'; session.studentId=id; uiState.loginError=''; uiState.studentTab='home'; render(); }

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function bindTeacherTab(tab){
  if (tab==='students'){
    document.getElementById('addStudentBtn').onclick = async ()=>{
      const name = document.getElementById('newStudentName').value.trim();
      const pin = document.getElementById('newStudentPin').value.trim();
      const jobTitle = document.getElementById('newStudentJob').value.trim();
      const payAmount = toCents(document.getElementById('newStudentPay').value || '0');
      const payFreq = document.getElementById('newStudentFreq').value;
      const householdId = document.getElementById('newStudentHousehold').value || null;
      if (!name || !pin){ showToast('Name and PIN are required'); return; }
      await refreshDb();
      const student = { id: uid('stu'), name, pin, jobTitle, payAmount, payFreq, householdId, checking: 0, savings: 0 };
      db.students.push(student);
      await saveDbWithToast('Student added'); render();
    };
    document.querySelectorAll('[data-del-student]').forEach(b=>{
      b.onclick = async ()=>{
        const id = b.dataset.delStudent;

        await refreshDb();
        db.students = db.students.filter(s=>s.id!==id);
        await saveDbWithToast('Student removed'); render();
      };

      b.onclick = ()=> openEditStudent(b.dataset.editStudent);

function openEditStudent(id){
  const s = getStudent(id);
  if (!s) return;
  const householdOpts = db.households.map(h=>`<option value="${h.id}" ${h.id===s.householdId?'selected':''}>${escapeHtml(h.name)}</option>`).join('');
  const html = `
    <div class="card" id="editStudentCard">
      <h3>Edit ${escapeHtml(s.name)}</h3>
      <div class="grid3">
        <div><label>Name</label><input type="text" id="editName" value="${escapeHtml(s.name)}"></div>
        <div><label>PIN</label><input type="text" id="editPin" value="${s.pin}"></div>
        <div><label>Household</label><select id="editHousehold"><option value="">— none —</option>${householdOpts}</select></div>
        <div><label>Job title</label><input type="text" id="editJob" value="${escapeHtml(s.jobTitle||'')}"></div>
        <div><label>Pay amount ($)</label><input type="number" step="0.01" id="editPay" value="${(s.payAmount/100).toFixed(2)}"></div>
        <div><label>Pay frequency</label><select id="editFreq">
          <option value="weekly" ${s.payFreq==='weekly'?'selected':''}>Weekly</option>
          <option value="biweekly" ${s.payFreq==='biweekly'?'selected':''}>Biweekly</option>
          <option value="monthly" ${s.payFreq==='monthly'?'selected':''}>Monthly</option>
        </select></div>
        <div><label>Adjust checking ($, +/-)</label><input type="number" step="0.01" id="editCheckingAdj" placeholder="0.00"></div>
        <div><label>Adjust savings ($, +/-)</label><input type="number" step="0.01" id="editSavingsAdj" placeholder="0.00"></div>
      </div>
      <button class="btn gold" id="saveEditStudent">Save changes</button>
      <button class="btn ghost" id="cancelEditStudent">Cancel</button>
    </div>`;
  const container = document.getElementById('teacherContent');
  container.insertAdjacentHTML('afterbegin', html);
  document.getElementById('cancelEditStudent').onclick = ()=> render();
  document.getElementById('saveEditStudent').onclick = async ()=>{
    const newName = document.getElementById('editName').value.trim();
    const newPin = document.getElementById('editPin').value.trim();
    const newHouseholdId = document.getElementById('editHousehold').value || null;
    const newJob = document.getElementById('editJob').value.trim();
    const newPay = toCents(document.getElementById('editPay').value || '0');
    const newFreq = document.getElementById('editFreq').value;
    const cAdj = toCents(document.getElementById('editCheckingAdj').value || '0');
    const sAdj = toCents(document.getElementById('editSavingsAdj').value || '0');
    await refreshDb();
    const fresh = getStudent(id);
    if (!fresh){ showToast('This student no longer exists'); render(); return; }
    fresh.name = newName || fresh.name;
    fresh.pin = newPin || fresh.pin;
    fresh.householdId = newHouseholdId;
    fresh.jobTitle = newJob;
    fresh.payAmount = newPay;
    fresh.payFreq = newFreq;
    if (cAdj !== 0){ fresh.checking += cAdj; addTx(fresh.id,'adjustment',cAdj,'Manual checking adjustment','checking'); }
    if (sAdj !== 0){ fresh.savings += sAdj; addTx(fresh.id,'adjustment',sAdj,'Manual savings adjustment','savings'); }
    await saveDbWithToast('Saved'); render();
  };
}

      <td class="small-note" style="margin:0;">${fmtDate(t.ts)}</td>
      <td><button class="btn sm ghost" data-edit-payroll="${t.id}">Edit</button>
          <button class="icon-btn" data-del-payroll="${t.id}">✕</button></td>
    </tr>`;
  }).join('');
  return `

    <div><h3 style="margin-bottom:2px;">Run payday</h3><div class="small-note" style="margin:0;">Pay every student their job wage in one click.</div></div>
    <button class="btn gold" id="payAllBtn">Pay everyone now</button>
  </div>
  <div class="card">
    <h3>Students & jobs</h3>
    ${db.students.length===0 ? `<div class="empty">Add students first on the Students tab.</div>` : `

    <tbody>${rows}</tbody></table>`}
  </div>
  <div class="card">
    <h3>Payroll history</h3>
    <div class="small-note">Made a mistake on a payment? Edit the amount (the student's checking balance adjusts automatically) or delete it entirely.</div>
    ${payrollRows.length===0 ? `<div class="empty">No payments issued yet.</div>` : `
    <table><thead><tr><th>Student</th><th>Description</th><th>Amount</th><th>Date</th><th></th></tr></thead><tbody>${payrollRows}</tbody></table>`}
  </div>`;
}
function bindPayroll(){
  document.getElementById('payAllBtn').onclick = async ()=>{
    await refreshDb();
    let count=0;
    db.students.forEach(s=>{
      if (s.payAmount>0){ s.checking += s.payAmount; addTx(s.id,'payday',s.payAmount,`Payday — ${s.jobTitle||'wages'}`); count++; }
    });
    await saveDbWithToast(`Paid ${count} student${count===1?'':'s'}`); render();
  };
  document.querySelectorAll('[data-pay-student]').forEach(b=>{
    b.onclick = async ()=>{
      const studentId = b.dataset.payStudent;
      await refreshDb();
      const s = getStudent(studentId);
      if (!s){ showToast('This student no longer exists'); render(); return; }
      s.checking += s.payAmount; addTx(s.id,'payday',s.payAmount,`Payday — ${s.jobTitle||'wages'}`);
      await saveDbWithToast(`Paid ${s.name} ${money(s.payAmount)}`); render();
    };
  });
  document.querySelectorAll('[data-edit-payroll]').forEach(b=>{
    b.onclick = ()=>{ uiState.editingPayrollId = b.dataset.editPayroll; render(); };
  });
  document.querySelectorAll('[data-cancel-payroll]').forEach(b=>{
    b.onclick = ()=>{ uiState.editingPayrollId = null; render(); };
  });
  document.querySelectorAll('[data-save-payroll]').forEach(b=>{
    b.onclick = async ()=>{
      const txId = b.dataset.savePayroll;
      const newAmount = toCents(document.getElementById('editPayrollAmount').value || '0');
      await refreshDb();
      const tx = db.transactions.find(t=>t.id===txId);
      if (!tx){ showToast('This payment no longer exists'); uiState.editingPayrollId = null; render(); return; }
      const student = getStudent(tx.studentId);
      const delta = newAmount - tx.amount;
      if (student) student.checking += delta;
      tx.amount = newAmount;
      uiState.editingPayrollId = null;
      await saveDbWithToast('Payment updated'); render();
    };
  });
  document.querySelectorAll('[data-del-payroll]').forEach(b=>{
    b.onclick = async ()=>{
      if (!(await showConfirm("Delete this payment? The amount will be removed from the student's checking balance."))) return;
      const txId = b.dataset.delPayroll;
      await refreshDb();
      const idx = db.transactions.findIndex(t=>t.id===txId);
      if (idx===-1){ showToast('This payment no longer exists'); render(); return; }
      const tx = db.transactions[idx];
      const student = getStudent(tx.studentId);
      if (student) student.checking -= tx.amount;
      db.transactions.splice(idx,1);
      await saveDbWithToast('Payment deleted'); render();
    };
  });
}

    <table><thead><tr><th>Student</th><th>Bill</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead><tbody>${chargeRows}</tbody></table>`}
  </div>`;
}
function issueChargeForBill(bill){
  if (bill.targetType === 'student'){
    db.charges.push({ id:uid('chg'), billId:bill.id, billName:bill.name, studentId:bill.targetId, amount:bill.amount, paid:false, createdAt:nowTs(), paidAt:null });
    return 1;
  }
  if (bill.targetType === 'students'){
    const targets = (bill.targetIds||[]).filter(id=>getStudent(id));
    targets.forEach(sid=>{
      db.charges.push({ id:uid('chg'), billId:bill.id, billName:bill.name, studentId:sid, amount:bill.amount, paid:false, createdAt:nowTs(), paidAt:null });
    });
    return targets.length;
  }
  // Household: split the bill evenly. Remainder cents (if the amount doesn't
  // divide evenly) are handed out one at a time so the total charged always
  // equals the bill amount exactly.
  const targets = getHousehold(bill.targetId)?.id ? db.students.filter(s=>s.householdId===bill.targetId).map(s=>s.id) : [];
  if (targets.length === 0) return 0;
  const base = Math.floor(bill.amount / targets.length);
  let remainder = bill.amount - base * targets.length;
  targets.forEach(sid=>{
    const share = base + (remainder > 0 ? 1 : 0);
    if (remainder > 0) remainder--;
    db.charges.push({ id:uid('chg'), billId:bill.id, billName:bill.name + ` (split ${targets.length} ways)`, studentId:sid, amount:share, paid:false, createdAt:nowTs(), paidAt:null });
  });
  return targets.length;
}
function bindBills(){
  document.getElementById('billModeSelect').onchange = (e)=>{
    uiState.billTargetMode = e.target.value;
    render();
  };
  document.getElementById('addBillBtn').onclick = async ()=>{
    const name = document.getElementById('newBillName').value.trim();
    const amount = toCents(document.getElementById('newBillAmount').value || '0');
    const mode = uiState.billTargetMode || 'student';
    if (!name || amount<=0){ showToast('Fill in the bill name and amount'); return; }
    let targetId, targetIds;
    if (mode === 'student'){
      targetId = document.getElementById('newBillStudentSingle')?.value;
      if (!targetId){ showToast('Choose a student'); return; }
    } else if (mode === 'household'){
      targetId = document.getElementById('newBillHousehold')?.value;
      if (!targetId){ showToast('Choose a household'); return; }
    } else {
      targetIds = Array.from(document.querySelectorAll('.bill-multi-student:checked')).map(el=>el.value);
      if (targetIds.length === 0){ showToast('Check at least one student'); return; }
    }
    await refreshDb();
    let bill;
    if (mode === 'student') bill = { id:uid('bill'), name, amount, targetType:'student', targetId };
    else if (mode === 'household') bill = { id:uid('bill'), name, amount, targetType:'household', targetId };
    else bill = { id:uid('bill'), name, amount, targetType:'students', targetIds };
    db.bills.push(bill);
    const n = issueChargeForBill(bill);
    await saveDbWithToast(`Charged ${n} student${n===1?'':'s'}`); render();
  };
  document.querySelectorAll('[data-issue-bill]').forEach(b=>{
    b.onclick = async ()=>{

      await refreshDb();
      const bill = db.bills.find(x=>x.id===billId);

  document.querySelectorAll('[data-del-bill]').forEach(b=>{

  });
  document.querySelectorAll('[data-cancel-bill]').forEach(b=>{
    b.onclick = ()=>{ uiState.editingBillId = null; render(); };
  });
  document.querySelectorAll('[data-save-bill]').forEach(b=>{
    b.onclick = async ()=>{
      const billId = b.dataset.saveBill;
      const newName = document.getElementById('editBillName').value.trim();
      const newAmount = toCents(document.getElementById('editBillAmount').value || '0');
      if (!newName || newAmount<=0){ showToast('Enter a name and amount'); return; }
      await refreshDb();
      const bill = db.bills.find(x=>x.id===billId);
      if (!bill){ showToast('This bill no longer exists'); uiState.editingBillId = null; render(); return; }
      bill.name = newName;
      bill.amount = newAmount;
      uiState.editingBillId = null;
      await saveDbWithToast('Bill template updated'); render();
    };
  });
  document.querySelectorAll('[data-edit-charge]').forEach(b=>{
    b.onclick = ()=>{ uiState.editingChargeId = b.dataset.editCharge; render(); };
  });
  document.querySelectorAll('[data-cancel-charge]').forEach(b=>{
    b.onclick = ()=>{ uiState.editingChargeId = null; render(); };
  });
  document.querySelectorAll('[data-save-charge]').forEach(b=>{
    b.onclick = async ()=>{
      const chargeId = b.dataset.saveCharge;
      const newAmount = toCents(document.getElementById('editChargeAmount').value || '0');
      const newPaid = document.getElementById('editChargePaid').checked;
      await refreshDb();
      const c = db.charges.find(x=>x.id===chargeId);
      if (!c){ showToast('This charge no longer exists'); uiState.editingChargeId = null; render(); return; }
      const student = getStudent(c.studentId);
      const oldAmount = c.amount, oldPaid = c.paid;
      if (student){
        if (oldPaid && newPaid){
          const delta = oldAmount - newAmount; // refund the difference either way
          if (delta !== 0){ student.checking += delta; addTx(student.id,'adjustment', delta, `Bill amount corrected: ${c.billName}`); }
        } else if (oldPaid && !newPaid){
          student.checking += oldAmount;
          addTx(student.id,'adjustment', oldAmount, `Marked unpaid (refund): ${c.billName}`);
        } else if (!oldPaid && newPaid){
          student.checking -= newAmount;
          addTx(student.id,'bill-payment', -newAmount, `Paid (recorded by teacher): ${c.billName}`);
        }
        // if !oldPaid && !newPaid, nothing to adjust — still unpaid
      }
      c.amount = newAmount;
      c.paid = newPaid;
      c.paidAt = newPaid ? (c.paidAt || nowTs()) : null;
      uiState.editingChargeId = null;
      await saveDbWithToast('Charge updated'); render();
    };
  });
  document.querySelectorAll('[data-del-charge]').forEach(b=>{
    b.onclick = async ()=>{
      if (!(await showConfirm('Delete this charge? If it was already paid, the amount will be refunded to the student.'))) return;
      const chargeId = b.dataset.delCharge;
      await refreshDb();
      const idx = db.charges.findIndex(x=>x.id===chargeId);
      if (idx===-1){ showToast('This charge no longer exists'); render(); return; }
      const c = db.charges[idx];
      const student = getStudent(c.studentId);
      if (c.paid && student){
        student.checking += c.amount;
        addTx(student.id,'adjustment', c.amount, `Charge deleted (refund): ${c.billName}`);
      }
      db.charges.splice(idx,1);
      await saveDbWithToast('Charge deleted'); render();
    };
  });
}

  });
  document.querySelectorAll('[data-cancel-ledger]').forEach(b=>{
    b.onclick = ()=>{ uiState.editingLedgerTxId = null; render(); };
  });
  document.querySelectorAll('[data-save-ledger]').forEach(b=>{
    b.onclick = async ()=>{
      const txId = b.dataset.saveLedger;
      const newAmount = toCents(document.getElementById('editLedgerAmount').value || '0');
      await refreshDb();
      const tx = db.transactions.find(t=>t.id===txId);
      if (!tx){ showToast('This transaction no longer exists'); uiState.editingLedgerTxId = null; render(); return; }
      const student = getStudent(tx.studentId);
      const account = tx.account || 'checking';
      const delta = newAmount - tx.amount;
      if (student && delta !== 0){
        if (account === 'savings') student.savings += delta; else student.checking += delta;
      }
      tx.amount = newAmount;
      uiState.editingLedgerTxId = null;
      await saveDbWithToast('Transaction updated'); render();
    };
  });
  document.querySelectorAll('[data-del-ledger]').forEach(b=>{
    b.onclick = async ()=>{
      if (!(await showConfirm("Delete this transaction? The student's balance will be adjusted to remove its effect. This does NOT undo linked transfers automatically — check the other side if this was a transfer."))) return;
      const txId = b.dataset.delLedger;
      await refreshDb();
      const idx = db.transactions.findIndex(t=>t.id===txId);
      if (idx===-1){ showToast('This transaction no longer exists'); render(); return; }
      const tx = db.transactions[idx];
      const student = getStudent(tx.studentId);
      const account = tx.account || 'checking';
      if (student){
        if (account === 'savings') student.savings -= tx.amount; else student.checking -= tx.amount;
      }
      db.transactions.splice(idx,1);
      await saveDbWithToast('Transaction deleted'); render();
    };
  });
}

    db = defaultDb(); await saveDbWithToast('All data reset'); render();
  };
  document.getElementById('exportBackupBtn').onclick = async ()=>{
    await refreshDb(); // export the absolute latest data, not a possibly-stale local copy
    const stamp = new Date().toISOString().slice(0,16).replace('T','_').replace(':','-');
    const filename = `junior-bank-backup-${stamp}.json`;
    const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Backup downloaded');
  };
  document.getElementById('importBackupInput').onchange = async (e)=>{
    const file = e.target.files[0];
    if (!file) return;
    try{
      const text = await file.text();
      const parsed = JSON.parse(text);
      const looksLikeRealDb = parsed && Array.isArray(parsed.students) && Array.isArray(parsed.transactions);
      if (!looksLikeRealDb){
        showToast("That file doesn't look like a Junior Bank backup");
        e.target.value = '';
        return;
      }
      const studentCount = parsed.students.length;
      const ok = await showConfirm(`Import this backup? This will REPLACE all current data with the backup (${studentCount} student${studentCount===1?'':'s'} found). This cannot be undone.`);
      e.target.value = '';
      if (!ok) return;
      db = parsed;
      await saveDbWithToast('Backup restored');
      render();
    }catch(err){
      console.error('import failed', err);
      showToast("Could not read that file — make sure it's a Junior Bank backup .json file");
      e.target.value = '';
    }
  };
}

/* ---- Dashboard tab (charts) ---- */
let balanceChartInstance = null;
let expenseChartInstance = null;
const EXPENSE_CATEGORY_LABELS = {
  'bill-payment': 'Bills',
  'purchase': 'Store',
  'transfer-out': 'Sent to Classmates',
  'adjustment': 'Adjustments'
};
const EXPENSE_CATEGORY_COLORS = {
  'Bills': '#CC8670',
  'Store': '#DDA85B',
  'Sent to Classmates': '#7C9A73',
  'Adjustments': '#A99A85'
};
function monthKey(ts){ const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(key){ const [y,m]=key.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'}); }
function dayLabel(ts){ const d=new Date(ts); return (d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear(); }

function renderStudentDashboard(){
  const s = currentStudent();
  const myTx = db.transactions.filter(t=>t.studentId===s.id).sort((a,b)=>a.ts-b.ts);
  const monthKeys = [...new Set(myTx.map(t=>monthKey(t.ts)))].sort();
  const selected = uiState.dashboardMonth || 'all';
  const monthOptions = `<option value="all" ${selected==='all'?'selected':''}>All months</option>` +
    monthKeys.map(k=>`<option value="${k}" ${selected===k?'selected':''}>${monthLabel(k)}</option>`).join('');

  // filter window
  let rangeStart = -Infinity, rangeEnd = Infinity;
  if (selected !== 'all'){
    const [y,m] = selected.split('-').map(Number);
    rangeStart = new Date(y, m-1, 1).getTime();
    rangeEnd = new Date(y, m, 1).getTime() - 1;
  }
  const inRange = t => t.ts >= rangeStart && t.ts <= rangeEnd;

  // expenses total for the selected window
  const expenseTypes = Object.keys(EXPENSE_CATEGORY_LABELS);
  const expenseTx = myTx.filter(t => inRange(t) && t.amount < 0 && expenseTypes.includes(t.type));
  const totalExpenses = expenseTx.reduce((a,t)=>a+Math.abs(t.amount),0);

  // expense breakdown by category
  const byCat = {};
  expenseTx.forEach(t=>{
    const label = EXPENSE_CATEGORY_LABELS[t.type] || 'Other';
    byCat[label] = (byCat[label]||0) + Math.abs(t.amount);
  });

  // balance history: running totals per account, sampled at each event day, within range (carrying in prior balance)
  function seriesFor(account){
    let bal = 0; const beforeRange = [];
    const points = [];
    myTx.forEach(t=>{
      if (t.account !== account) return;
      bal += t.amount;
      if (t.ts < rangeStart) beforeRange.push(bal);
      if (inRange(t)) points.push({ ts:t.ts, bal });
    });
    const carryIn = beforeRange.length ? beforeRange[beforeRange.length-1] : 0;
    return { carryIn, points };
  }
  const checkingSeries = seriesFor('checking');
  const savingsSeries = seriesFor('savings');
  const allDays = [...new Set([...checkingSeries.points, ...savingsSeries.points].map(p=>dayLabel(p.ts)))]
    .sort((a,b)=>{
      const [am,ad,ay]=a.split('/').map(Number), [bm,bd,by]=b.split('/').map(Number);
      return new Date(ay,am-1,ad) - new Date(by,bm-1,bd);
    });
  function buildStepData(series, days){
    let bal = series.carryIn;
    const dayToLast = {};
    series.points.forEach(p=>{ dayToLast[dayLabel(p.ts)] = p.bal; });
    return days.map(day=>{ if (dayToLast[day] !== undefined) bal = dayToLast[day]; return bal; });
  }
  const labels = allDays.length ? allDays : ['No activity yet'];
  const checkingData = allDays.length ? buildStepData(checkingSeries, allDays) : [s.checking];
  const savingsData = allDays.length ? buildStepData(savingsSeries, allDays) : [s.savings];

  window.__dashboardChartData = {
    labels, checkingData, savingsData,
    expenseLabels: Object.keys(byCat), expenseData: Object.values(byCat)
  };

  return `
  <div class="card">
    <div class="dash-header">
      <h3 style="margin:0;">${escapeHtml(s.name)}'s Dashboard</h3>
      <div class="dash-filter"><label style="display:inline;margin-right:8px;text-transform:none;font-size:12.5px;">View</label>
        <select id="dashboardMonthSelect">${monthOptions}</select>
      </div>
    </div>
    <div class="dash-summary">
      <div class="dash-stat"><div class="dl">Checking</div><div class="dv checking" style="${s.checking<0?'color:var(--rust);':''}">${money(s.checking)}</div></div>
      <div class="dash-stat"><div class="dl">Savings</div><div class="dv savings">${money(s.savings)}</div></div>
      <div class="dash-stat"><div class="dl">Expenses${selected==='all'?' (all time)':''}</div><div class="dv expenses">${money(totalExpenses)}</div></div>
    </div>
  </div>
  <div class="card">
    <div class="chart-grid">
      <div>
        <h3>Account Balances Over Time</h3>
        <div class="chart-box"><canvas id="balanceChart"></canvas></div>
      </div>
      <div>
        <h3>Expenses Breakdown</h3>
        <div class="chart-box">${Object.keys(byCat).length===0 ? `<div class="empty">No expenses in this period.</div>` : `<canvas id="expenseChart"></canvas>`}</div>
      </div>
    </div>
  </div>`;
}

function bindStudentDashboard(){
  const sel = document.getElementById('dashboardMonthSelect');
  sel.onchange = ()=>{ uiState.dashboardMonth = sel.value; render(); };

  const data = window.__dashboardChartData;
  if (!data || typeof Chart === 'undefined') return;

  if (balanceChartInstance){ balanceChartInstance.destroy(); balanceChartInstance = null; }
  const balCanvas = document.getElementById('balanceChart');
  if (balCanvas){
    balanceChartInstance = new Chart(balCanvas, {
      type: 'line',
      data: {
        labels: data.labels,
        datasets: [
          { label:'Checking', data:data.checkingData, borderColor:'#7C9A73', backgroundColor:'rgba(124,154,115,0.12)', fill:true, tension:0.35, pointRadius:3 },
          { label:'Savings', data:data.savingsData, borderColor:'#8CA9C4', backgroundColor:'rgba(140,169,196,0.12)', fill:true, tension:0.35, pointRadius:3 }
        ]
      },
      options: {
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ position:'top', labels:{ boxWidth:12, font:{ family:'Nunito', size:12 } } } },
        scales:{ y:{ ticks:{ callback:v=>'$'+v, font:{family:'IBM Plex Mono', size:11} } }, x:{ ticks:{ font:{ family:'Nunito', size:11 } } } }
      }
    });
  }
  if (expenseChartInstance){ expenseChartInstance.destroy(); expenseChartInstance = null; }
  const expCanvas = document.getElementById('expenseChart');
  if (expCanvas && data.expenseLabels.length){
    expenseChartInstance = new Chart(expCanvas, {
      type: 'doughnut',
      data: {
        labels: data.expenseLabels,
        datasets:[{ data:data.expenseData, backgroundColor: data.expenseLabels.map(l=>EXPENSE_CATEGORY_COLORS[l]||'#A99A85'), borderWidth:2, borderColor:'#fff' }]
      },
      options: {
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ position:'right', labels:{ boxWidth:12, font:{ family:'Nunito', size:12 } } } }
      }
    });
  }
}

function renderStudentSend(){
  const s = currentStudent();
  const others = db.students.filter(x=>x.id!==s.id).sort((a,b)=>a.name.localeCompare(b.name));
  const preselect = uiState.sendPreselect || '';
  return `
  <div class="card">
    <h3>Send money to a classmate</h3>
    <div class="small-note">Available in checking: <b class="mono">${money(s.checking)}</b></div>
    <label>Send to</label>
    <select id="sendToSelect">${others.map(o=>`<option value="${o.id}" ${o.id===preselect?'selected':''}>${escapeHtml(o.name)}</option>`).join('')}</select>
    <label>Amount ($)</label>
    <input type="number" step="0.01" id="sendAmount" placeholder="1.00">
    <label>What's it for? (optional)</label>
    <input type="text" id="sendNote" placeholder="e.g. Splitting snack money">
    <button class="btn gold" id="sendMoneyBtn">Send</button>
  </div>`;
}
function bindSendMoney(){
  uiState.sendPreselect = null;
  document.getElementById('sendMoneyBtn').onclick = async ()=>{
    const toId = document.getElementById('sendToSelect').value;
    const amt = toCents(document.getElementById('sendAmount').value || '0');
    const note = document.getElementById('sendNote').value.trim();
    if (amt<=0){ showToast('Choose a recipient and amount'); return; }
    await refreshDb();
    const s = currentStudent();
    const to = getStudent(toId);
    if (!to){ showToast('Choose a recipient and amount'); return; }
    if (amt > s.checking){ showToast('Not enough in checking'); return; }
    s.checking -= amt; to.checking += amt;
    addTx(s.id,'transfer-out',-amt, note?`To ${to.name} — ${note}`:`To ${to.name}`);
    addTx(to.id,'transfer-in',amt, note?`From ${s.name} — ${note}`:`From ${s.name}`);
    await saveDbWithToast(`Sent ${money(amt)} to ${to.name}`); render();
  };
}

function renderStudentBills(){
  const s = currentStudent();
  const unpaid = db.charges.filter(c=>c.studentId===s.id && !c.paid).sort((a,b)=>a.createdAt-b.createdAt);
  const paid = db.charges.filter(c=>c.studentId===s.id && c.paid).sort((a,b)=>b.paidAt-a.paidAt).slice(0,10);
  return `
  <div class="card">
    <h3>Bills to pay</h3>
    ${unpaid.length===0 ? `<div class="empty">No unpaid bills — nice work!</div>` :
      unpaid.map(c=>`<div class="ledger-row"><span>${escapeHtml(c.billName)}</span>
        <span style="display:flex;align-items:center;gap:10px;">
          <span class="ledger-amt neg">${money(c.amount)}</span>
          <button class="btn sm gold" data-pay-charge="${c.id}">Pay</button>
        </span></div>`).join('')}
  </div>
  <div class="card">
    <h3>Recently paid</h3>
    ${paid.length===0 ? `<div class="empty">Nothing paid yet.</div>` :
      paid.map(c=>`<div class="ledger-row"><span>${escapeHtml(c.billName)} <span class="stamp">Paid</span></span><span class="ledger-amt neg">${money(c.amount)}</span></div>`).join('')}
  </div>`;
}
function bindStudentBills(){
  document.querySelectorAll('[data-pay-charge]').forEach(b=>{
    b.onclick = async ()=>{
      const chargeId = b.dataset.payCharge;
      await refreshDb();
      const s = currentStudent();
      const c = db.charges.find(x=>x.id===chargeId);
      if (!c){ showToast('This bill no longer exists'); render(); return; }
      if (c.paid){ showToast('This bill was already paid'); render(); return; }
      const willBeNegative = c.amount > s.checking;
      s.checking -= c.amount; c.paid = true; c.paidAt = nowTs();
      addTx(s.id,'bill-payment',-c.amount,`Paid: ${c.billName}`);
      await saveDbWithToast(willBeNegative ? `Paid ${escapeHtml(c.billName)} — checking is now negative` : `Paid ${escapeHtml(c.billName)}`);
      render();
    };
  });
}

function renderStudentStore(){
  const s = currentStudent();
  const items = db.storeItems.filter(it=> it.stock===null || it.stock>0);
  const purchases = db.transactions.filter(t=>t.studentId===s.id && t.type==='purchase').sort((a,b)=>b.ts-a.ts);
  return `
  <div class="card">
    <div class="flex-between"><h3 style="margin:0;">Class Store</h3><div class="small-note" style="margin:0;">Checking: <b class="mono">${money(s.checking)}</b></div></div>
  </div>
  <div class="card">
    ${items.length===0 ? `<div class="empty">The store is empty right now.</div>` : `
    <div class="store-grid">
      ${items.map(it=>`
        <div class="store-item">
          ${it.image ? `<img class="ithumb" src="${it.image}">` : `<div class="ithumb-placeholder">No photo</div>`}
          <div class="iname">${escapeHtml(it.name)}</div>
          <div class="iprice">${money(it.price)}</div>
          <div class="istock">${it.stock===null?'In stock':it.stock+' left'}</div>
          <button class="btn sm gold" data-buy-item="${it.id}" ${it.price>s.checking?'disabled':''}>Buy</button>
        </div>`).join('')}
    </div>`}
  </div>
  <div class="card">
    <h3>My Purchases</h3>
    ${purchases.length===0 ? `<div class="empty">You haven't bought anything yet.</div>` :
      purchases.map(t=>`<div class="ledger-row"><span>${escapeHtml(t.desc.replace(/^Bought:\\s*/,''))} <span class="small-note" style="margin:0;">— ${fmtDate(t.ts)}</span></span><span class="ledger-amt neg">${money(t.amount)}</span></div>`).join('')}
  </div>`;
}
function bindStudentStore(){
  document.querySelectorAll('[data-buy-item]').forEach(b=>{
    b.onclick = async ()=>{
      const itemId = b.dataset.buyItem;
      await refreshDb();
      const s = currentStudent();
      const it = db.storeItems.find(x=>x.id===itemId);
      if (!it){ showToast('That item is no longer available'); render(); return; }
      if (it.stock!==null && it.stock<=0){ showToast('Out of stock'); render(); return; }
      if (it.price > s.checking){ showToast('Not enough in checking'); render(); return; }
      s.checking -= it.price;
      if (it.stock!==null) it.stock -= 1;
      addTx(s.id,'purchase',-it.price,`Bought: ${it.name}`);
      await saveDbWithToast(`Bought ${it.name}`); render();
    };
  });
}

function renderStudentTransfer(){
  const s = currentStudent();
  return `
  <div class="card">
    <h3>Move money between accounts</h3>
    <div class="grid2">
      <div><div class="small-note">Checking</div><div class="mono" style="font-size:20px;">${money(s.checking)}</div></div>
      <div><div class="small-note">Savings</div><div class="mono" style="font-size:20px;">${money(s.savings)}</div></div>
    </div>
    <label>Amount ($)</label>
    <input type="number" step="0.01" id="transferAmount" placeholder="1.00">
    <div class="row-inline">
      <button class="btn gold" id="toSavingsBtn">Checking → Savings</button>
      <button class="btn ghost" id="toCheckingBtn">Savings → Checking</button>
    </div>
  </div>`;
}
function bindStudentTransfer(){
  document.getElementById('toSavingsBtn').onclick = async ()=>{
    const amt = toCents(document.getElementById('transferAmount').value || '0');
    if (amt<=0){ showToast('Enter an amount'); return; }
    await refreshDb();
    const s = currentStudent();
    if (amt>s.checking){ showToast('Not enough in checking'); return; }
    s.checking -= amt; s.savings += amt;
    addTx(s.id,'internal',-amt,'Transfer to savings','checking');
    addTx(s.id,'internal',amt,'Transfer to savings (deposit)','savings');
    await saveDbWithToast('Moved to savings'); render();
  };
  document.getElementById('toCheckingBtn').onclick = async ()=>{
    const amt = toCents(document.getElementById('transferAmount').value || '0');
    if (amt<=0){ showToast('Enter an amount'); return; }
    await refreshDb();
    const s = currentStudent();
    if (amt>s.savings){ showToast('Not enough in savings'); return; }
    s.savings -= amt; s.checking += amt;
    addTx(s.id,'internal',-amt,'Transfer to checking','savings');
    addTx(s.id,'internal',amt,'Transfer to checking (deposit)','checking');
    await saveDbWithToast('Moved to checking'); render();
  };
}

function renderStudentActivity(){
  const s = currentStudent();
  const txs = db.transactions.filter(t=>t.studentId===s.id).sort((a,b)=>b.ts-a.ts);
  const totalIn = txs.filter(t=>t.amount>0).reduce((a,t)=>a+t.amount,0);
  const totalOut = txs.filter(t=>t.amount<0).reduce((a,t)=>a+t.amount,0);
  return `
  <div class="card grid2">
    <div><div class="small-note">Total earned</div><div class="mono" style="font-size:20px;color:var(--teal);">${money(totalIn)}</div></div>
    <div><div class="small-note">Total spent</div><div class="mono" style="font-size:20px;color:var(--rust);">${money(totalOut)}</div></div>
  </div>
  <div class="card">
    <h3>Full history</h3>
    ${txs.length===0 ? `<div class="empty">No activity yet.</div>` :
      txs.map(t=>`<div class="ledger-row"><span>${fmtDate(t.ts)} — ${escapeHtml(t.desc)}</span><span class="ledger-amt ${t.amount>=0?'pos':'neg'}">${t.amount>=0?'+':''}${money(t.amount)}</span></div>`).join('')}
  </div>`;
}

function bindStudentTab(tab){
  if (tab==='dashboard') bindStudentDashboard();
  if (tab==='household') bindStudentHousehold();
  if (tab==='send') bindSendMoney();
  if (tab==='bills') bindStudentBills();
  if (tab==='store') bindStudentStore();
  if (tab==='transfer') bindStudentTransfer();
}
function bindStudentHousehold(){
  document.querySelectorAll('[data-quick-send]').forEach(b=>{
    b.onclick = ()=>{
      uiState.sendPreselect = b.dataset.quickSend;
      uiState.studentTab = 'send';
      render();
    };
  });
}
